name: Inspect AssetsTools.NET.Texture

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DLL
        shell: bash
        run: |
          echo "=== MENCARI DLL ==="
          find . -type f -iname "AssetsTools.NET.Texture.dll" -print

      - name: Install ILSpy
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Find DLL path
        shell: bash
        run: |
          DLL=$(find . -type f -iname "AssetsTools.NET.Texture.dll" | head -n 1)

          if [ -z "$DLL" ]; then
            echo "❌ AssetsTools.NET.Texture.dll tidak ditemukan."
            exit 1
          fi

          echo "DLL ditemukan:"
          echo "$DLL"

          echo "DLL_PATH=$DLL" >> "$GITHUB_ENV"

      - name: Decompile DLL
        shell: bash
        run: |
          mkdir -p decompiled

          ilspycmd \
            -p \
            -o decompiled \
            "$DLL_PATH"

      - name: Search TextureFormat
        shell: bash
        run: |
          echo "======================================"
          echo "TEXTUREFORMAT"
          echo "======================================"

          grep -Rni \
            -E "TextureFormat|ETC2A8|DecodeManaged|DecompressETC" \
            decompiled \
            | head -n 300 \
            || true

      - name: Search enum value 34
        shell: bash
        run: |
          echo "======================================"
          echo "KONTEKS NILAI 34"
          echo "======================================"

          grep -Rni \
            -E "34|ETC_RGB4|ETC2" \
            decompiled \
            | head -n 300 \
            || true

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: AssetsTools-NET-Texture-decompiled
          path: decompiled/
