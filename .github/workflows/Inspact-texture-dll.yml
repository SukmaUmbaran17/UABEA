name: Inspect Texture DLL - Manual

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Texture DLL
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "CHECK AssetsTools.NET.Texture.dll"
          Write-Host "======================================"

          $dll = Join-Path $env:GITHUB_WORKSPACE "Libs\AssetsTools.NET.Texture.dll"

          if (!(Test-Path $dll)) {
              Write-Host "DLL TIDAK DITEMUKAN:"
              Write-Host $dll
              exit 1
          }

          $info = Get-Item $dll

          Write-Host "DLL:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "SIZE:"
          Write-Host $info.Length

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create DllInspector
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force DllInspector | Out-Null

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;

          class Program
          {
              static void Main()
              {
                  Console.WriteLine("======================================");
                  Console.WriteLine("ASSETS TOOLS TEXTURE INSPECTOR");
                  Console.WriteLine("======================================");

                  string dllPath =
                      Path.GetFullPath(
                          Path.Combine(
                              "..",
                              "Libs",
                              "AssetsTools.NET.Texture.dll"));

                  Console.WriteLine();
                  Console.WriteLine("DLL:");
                  Console.WriteLine(dllPath);

                  if (!File.Exists(dllPath))
                  {
                      Console.WriteLine();
                      Console.WriteLine("ERROR: DLL TIDAK DITEMUKAN.");
                      return;
                  }

                  Assembly asm =
                      Assembly.LoadFrom(dllPath);

                  Console.WriteLine();
                  Console.WriteLine("Full Name:");
                  Console.WriteLine(asm.FullName);

                  Console.WriteLine();
                  Console.WriteLine("======================================");
                  Console.WriteLine("REFERENCES");
                  Console.WriteLine("======================================");

                  foreach (var reference in asm.GetReferencedAssemblies())
                  {
                      Console.WriteLine(
                          reference.FullName);
                  }

                  Console.WriteLine();
                  Console.WriteLine("======================================");
                  Console.WriteLine("TEXTURE TYPES");
                  Console.WriteLine("======================================");

                  foreach (var type in asm.GetTypes()
                      .OrderBy(x => x.FullName))
                  {
                      string name =
                          type.FullName ?? type.Name;

                      if (
                          name.Contains(
                              "TextureFile",
                              StringComparison.OrdinalIgnoreCase)
                          ||
                          name.Contains(
                              "TextureFormat",
                              StringComparison.OrdinalIgnoreCase)
                          ||
                          name.Contains(
                              "ETC",
                              StringComparison.OrdinalIgnoreCase)
                          ||
                          name.Contains(
                              "Decoder",
                              StringComparison.OrdinalIgnoreCase))
                      {
                          Console.WriteLine();
                          Console.WriteLine(
                              "[TYPE] " + name);

                          var methods =
                              type.GetMethods(
                                  BindingFlags.Public |
                                  BindingFlags.NonPublic |
                                  BindingFlags.Static |
                                  BindingFlags.Instance |
                                  BindingFlags.DeclaredOnly);

                          foreach (var method in methods
                              .OrderBy(x => x.Name))
                          {
                              Console.WriteLine(
                                  "  " +
                                  method.ToString());
                          }
                      }
                  }

                  Console.WriteLine();
                  Console.WriteLine("======================================");
                  Console.WriteLine("TEXTURE FORMAT ENUM");
                  Console.WriteLine("======================================");

                  Type? formatType =
                      asm.GetTypes()
                      .FirstOrDefault(
                          x =>
                              x.Name ==
                              "TextureFormat");

                  if (formatType != null &&
                      formatType.IsEnum)
                  {
                      foreach (var value in
                          Enum.GetValues(formatType))
                      {
                          string name =
                              Enum.GetName(
                                  formatType,
                                  value)
                              ?? "(unknown)";

                          object? raw =
                              Convert.ChangeType(
                                  value,
                                  Enum.GetUnderlyingType(
                                      formatType));

                          Console.WriteLine(
                              name +
                              " = " +
                              raw);
                      }
                  }
                  else
                  {
                      Console.WriteLine(
                          "TextureFormat enum tidak ditemukan.");
                  }

                  Console.WriteLine();
                  Console.WriteLine("======================================");
                  Console.WriteLine("TARGET METHODS");
                  Console.WriteLine("======================================");

                  Type? textureFile =
                      asm.GetTypes()
                      .FirstOrDefault(
                          x =>
                              x.FullName ==
                              "AssetsTools.NET.Texture.TextureFile");

                  if (textureFile != null)
                  {
                      foreach (var method in
                          textureFile.GetMethods(
                              BindingFlags.Public |
                              BindingFlags.NonPublic |
                              BindingFlags.Static |
                              BindingFlags.Instance |
                              BindingFlags.DeclaredOnly)
                          .Where(
                              x =>
                                  x.Name.Contains(
                                      "Decode",
                                      StringComparison.OrdinalIgnoreCase)
                                  ||
                                  x.Name.Contains(
                                      "TextureData",
                                      StringComparison.OrdinalIgnoreCase)
                                  ||
                                  x.Name.Contains(
                                      "PictureData",
                                      StringComparison.OrdinalIgnoreCase))
                          .OrderBy(x => x.Name))
                      {
                          Console.WriteLine();
                          Console.WriteLine(
                              "METHOD:");

                          Console.WriteLine(
                              method.ToString());

                          Console.WriteLine(
                              "IsStatic: " +
                              method.IsStatic);

                          Console.WriteLine(
                              "Return: " +
                              method.ReturnType.FullName);

                          Console.WriteLine(
                              "Parameters:");

                          foreach (var parameter in
                              method.GetParameters())
                          {
                              Console.WriteLine(
                                  "  " +
                                  parameter.Position +
                                  ": " +
                                  parameter.ParameterType.FullName +
                                  " " +
                                  parameter.Name);
                          }
                      }
                  }

                  Console.WriteLine();
                  Console.WriteLine("======================================");
                  Console.WriteLine("INSPECTION SELESAI");
                  Console.WriteLine("======================================");
              }
          }
          '@ | Set-Content `
              -Encoding UTF8 `
              DllInspector\Program.cs

      - name: Create Inspector Project
        shell: pwsh
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>

          </Project>
          '@ | Set-Content `
              -Encoding UTF8 `
              DllInspector\DllInspector.csproj

      - name: Build Inspector
        shell: pwsh
        run: |
          dotnet build `
            DllInspector\DllInspector.csproj `
            -c Release

      - name: Run Inspector
        shell: pwsh
        run: |
          Set-Location DllInspector

          dotnet run `
            --project DllInspector.csproj `
            -c Release `
            --no-build

      - name: Upload Inspector Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Texture-DLL-Inspector
          path: |
            DllInspector/Program.cs
            DllInspector/DllInspector.csproj
          if-no-files-found: warn
