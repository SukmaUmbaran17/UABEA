name: Inspect AssetsTools.NET.Texture

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Texture DLL
        shell: bash
        run: |
          echo "=== MENCARI DLL ==="

          find . \
            -type f \
            -iname "AssetsTools.NET.Texture.dll" \
            -print

      - name: Download ILSpy
        shell: bash
        run: |
          mkdir -p tools

          wget -q \
            https://github.com/icsharpcode/ILSpy/releases/latest/download/ILSpy_binaries_linux-x64.zip \
            -O tools/ilspy.zip

          unzip -q \
            tools/ilspy.zip \
            -d tools/ilspy

          echo "=== ILSPY ==="
          find tools/ilspy -maxdepth 2 -type f | head -50

      - name: Locate DLL
        shell: bash
        run: |
          DLL=$(find . \
            -type f \
            -iname "AssetsTools.NET.Texture.dll" \
            | head -n 1)

          if [ -z "$DLL" ]; then
            echo "❌ AssetsTools.NET.Texture.dll TIDAK DITEMUKAN"
            exit 1
          fi

          echo "================================"
          echo "DLL DITEMUKAN:"
          echo "$DLL"
          echo "================================"

          echo "DLL_PATH=$DLL" >> "$GITHUB_ENV"

      - name: Find ILSpy command
        shell: bash
        run: |
          find tools/ilspy \
            -type f \
            \( -name "ilspycmd" -o -name "ILSpyCmd" \) \
            -print

      - name: Decompile DLL
        shell: bash
        run: |
          mkdir -p decompiled

          ILSPY=$(find tools/ilspy \
            -type f \
            \( -name "ilspycmd" -o -name "ILSpyCmd" \) \
            | head -n 1)

          if [ -z "$ILSPY" ]; then
            echo "❌ ilspycmd tidak ditemukan."
            exit 1
          fi

          chmod +x "$ILSPY"

          echo "ILSpy:"
          "$ILSPY" --version || true

          echo "================================"
          echo "DECOMPILING:"
          echo "$DLL_PATH"
          echo "================================"

          "$ILSPY" \
            -p \
            -o decompiled \
            "$DLL_PATH"

      - name: Search Texture Decoder
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "=== TEXTURE FORMAT / DECODER ==="
          echo "======================================"

          grep -Rni \
            -E \
            "TextureFormat|DecodeManaged|ETC2A8|ETC_RGB4|DecompressETC" \
            decompiled \
            | head -n 500 \
            || true

      - name: Upload Decompiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: AssetsTools-NET-Texture-decompiled
          path: decompiled/
