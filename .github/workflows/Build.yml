name: Build UABEA Android Native APK

on:
  workflow_dispatch: # Membuat tombol manual di GitHub untuk memulai build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Memasang .NET modern yang mendukung Avalonia Android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Install Android SDK Workloads
      run: |
        dotnet workload install android
        dotnet workload install avalonia

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Android Project
      run: |
        # Perintah untuk mengompilasi proyek spesifik Android ke mode Release
        dotnet publish -c Release -r android-arm64 --no-self-contained

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEA-Android-APK
        path: '**/bin/Release/**/publish/*.apk'
