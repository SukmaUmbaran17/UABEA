name: Build UABEA Android

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build UABEA Android
    runs-on: windows-latest

    steps:

      # =========================================================
      # 1. CHECKOUT SOURCE
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. .NET 8
      # =========================================================

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # =========================================================
      # 4. INSTALL ANDROID WORKLOAD
      # =========================================================

      - name: Install Android workload
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================="
          Write-Host "INSTALL ANDROID WORKLOAD"
          Write-Host "======================================="

          dotnet workload install android

          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Android workload gagal."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "✓ Android workload berhasil."


      # =========================================================
      # 5. PREPARE LIBS
      # =========================================================

      - name: Prepare AssetsTools libraries
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================="
          Write-Host "PREPARE ASSETSTOOLS LIBRARIES"
          Write-Host "======================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "Libs" | Out-Null

          Write-Host "✓ Folder Libs siap."


      # =========================================================
      # 6. DOWNLOAD ASSETSTOOLS.NET DLL
      # =========================================================

      - name: Download AssetsTools.NET libraries
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "DOWNLOAD ASSETSTOOLS.NET"
          Write-Host "======================================="

          $base = "https://github.com/nesrak1/UABEA/raw/master/Libs"

          Write-Host ""
          Write-Host "Downloading AssetsTools.NET.dll..."

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.dll" `
            -OutFile "Libs/AssetsTools.NET.dll"

          Write-Host "Downloading AssetsTools.NET.Cpp2IL.dll..."

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.Cpp2IL.dll" `
            -OutFile "Libs/AssetsTools.NET.Cpp2IL.dll"

          Write-Host "Downloading AssetsTools.NET.MonoCecil.dll..."

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.MonoCecil.dll" `
            -OutFile "Libs/AssetsTools.NET.MonoCecil.dll"

          Write-Host "Downloading AssetsTools.NET.Texture.dll..."

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.Texture.dll" `
            -OutFile "Libs/AssetsTools.NET.Texture.dll"

          Write-Host ""
          Write-Host "✓ Semua download selesai."


      # =========================================================
      # 7. VERIFY DLL
      # =========================================================

      - name: Verify AssetsTools libraries
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY ASSETSTOOLS DLL"
          Write-Host "======================================="

          $required = @(
            "Libs/AssetsTools.NET.dll",
            "Libs/AssetsTools.NET.Cpp2IL.dll",
            "Libs/AssetsTools.NET.MonoCecil.dll",
            "Libs/AssetsTools.NET.Texture.dll"
          )

          $failed = $false

          foreach ($file in $required) {

            if (Test-Path $file) {

              $item = Get-Item $file

              Write-Host ""
              Write-Host "✓ FOUND"
              Write-Host "  File : $file"
              Write-Host "  Size : $($item.Length) bytes"

            }
            else {

              Write-Host ""
              Write-Host "❌ MISSING"
              Write-Host "  File : $file"

              $failed = $true
            }
          }

          if ($failed) {

            Write-Host ""
            Write-Host "❌ DLL verification gagal."

            exit 1
          }

          Write-Host ""
          Write-Host "✓ Semua DLL tersedia."


      # =========================================================
      # 8. SHOW LIBS
      # =========================================================

      - name: Show AssetsTools libraries
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "LIBS CONTENT"
          Write-Host "======================================="

          Get-ChildItem `
            "Libs" `
            -File |
            Select-Object Name, Length


      # =========================================================
      # 9. VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY ANDROID PROJECT"
          Write-Host "======================================="

          $project =
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj"

          $main =
            "UABEAvalonia.Android/MainActivity.cs"

          if (!(Test-Path $project)) {

            Write-Host ""
            Write-Host "❌ Android csproj tidak ditemukan:"
            Write-Host $project

            exit 1
          }

          if (!(Test-Path $main)) {

            Write-Host ""
            Write-Host "❌ MainActivity.cs tidak ditemukan:"
            Write-Host $main

            exit 1
          }

          Write-Host "✓ UABEAvalonia.Android.csproj"
          Write-Host "✓ MainActivity.cs"


      # =========================================================
      # 10. VERIFY MAINACTIVITY TEXTURE API
      # =========================================================

      - name: Verify MainActivity texture API
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY MAINACTIVITY TEXTURE API"
          Write-Host "======================================="

          $main =
            "UABEAvalonia.Android/MainActivity.cs"

          $content =
            Get-Content $main -Raw

          Write-Host ""
          Write-Host "Checking GetImageData()..."

          # Hanya menganggap error jika benar-benar ada
          # pemanggilan method .GetImageData(...)
          if ($content -match '\.GetImageData\s*\(') {

            Write-Host ""
            Write-Host "❌ PEMANGGILAN GetImageData() DITEMUKAN."

            Write-Host ""
            Write-Host "Lokasi:"
            
            Select-String `
              -Path $main `
              -Pattern '\.GetImageData\s*\(' `
              -Context 3,3

            Write-Host ""
            Write-Host "Gunakan GetTextureData() sesuai API TextureFile."

            exit 1
          }

          Write-Host "✓ Tidak ada pemanggilan GetImageData()."


          # -------------------------------------------------------
          # Check GetTextureData
          # -------------------------------------------------------

          Write-Host ""
          Write-Host "Checking GetTextureData()..."

          if ($content -match '\.GetTextureData\s*\(') {

            Write-Host "✓ GetTextureData() ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "⚠ GetTextureData() tidak ditemukan."

            Write-Host ""
            Write-Host "MainActivity yang digunakan tidak terlihat"
            Write-Host "memanggil TextureFile.GetTextureData()."

            exit 1
          }


          # -------------------------------------------------------
          # Check DecodeManaged
          # -------------------------------------------------------

          Write-Host ""
          Write-Host "Checking DecodeManaged()..."

          if ($content -match 'TextureFile\.DecodeManaged\s*\(') {

            Write-Host "✓ TextureFile.DecodeManaged() ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "⚠ TextureFile.DecodeManaged() tidak ditemukan."

            Write-Host ""
            Write-Host "Periksa bagian decoder texture."

          }


          Write-Host ""
          Write-Host "✓ MainActivity texture API check selesai."


      # =========================================================
      # 11. SHOW TEXTURE REFERENCES
      # =========================================================

      - name: Show texture references
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "TEXTURE REFERENCES"
          Write-Host "======================================="

          $main =
            "UABEAvalonia.Android/MainActivity.cs"

          Write-Host ""
          Write-Host "GetTextureData:"
          Select-String `
            -Path $main `
            -Pattern "GetTextureData" `
            -Context 2,2

          Write-Host ""
          Write-Host "DecodeManaged:"
          Select-String `
            -Path $main `
            -Pattern "DecodeManaged" `
            -Context 2,2

          Write-Host ""
          Write-Host "CreateBitmapFromBgra:"
          Select-String `
            -Path $main `
            -Pattern "CreateBitmapFromBgra" `
            -Context 2,2


      # =========================================================
      # 12. VERIFY CSPROJ TEXTURE DLL
      # =========================================================

      - name: Verify Texture DLL project reference
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY CSPROJ REFERENCES"
          Write-Host "======================================="

          $project =
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj"

          $content =
            Get-Content $project -Raw

          if ($content -match "AssetsTools\.NET\.Texture") {

            Write-Host "✓ AssetsTools.NET.Texture reference ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "⚠ AssetsTools.NET.Texture tidak ditemukan"
            Write-Host "di csproj."

            Write-Host ""
            Write-Host "Jika DLL digunakan melalui Reference/HintPath,"
            Write-Host "pastikan reference tersebut tersedia."
          }


          if ($content -match "AssetsTools\.NET\.dll") {

            Write-Host "✓ AssetsTools.NET reference ditemukan."

          }
          else {

            Write-Host "⚠ AssetsTools.NET reference tidak ditemukan."
          }


      # =========================================================
      # 13. RESTORE
      # =========================================================

      - name: Restore Android project
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "DOTNET RESTORE"
          Write-Host "======================================="

          dotnet restore `
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj"

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "❌ dotnet restore gagal."

            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "✓ Restore berhasil."


      # =========================================================
      # 14. BUILD APK
      # =========================================================

      - name: Build Android APK
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "BUILD UABEA ANDROID APK"
          Write-Host "======================================="

          dotnet build `
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj" `
            -c Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {

            Write-Host ""
            Write-Host "❌ BUILD APK GAGAL."

            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "✓ BUILD BERHASIL."


      # =========================================================
      # 15. SEARCH APK
      # =========================================================

      - name: Find APK
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "SEARCH APK"
          Write-Host "======================================="

          $apks =
            Get-ChildItem `
              -Path "." `
              -Recurse `
              -Filter "*.apk" `
              -File

          if ($apks.Count -eq 0) {

            Write-Host ""
            Write-Host "❌ APK tidak ditemukan."

            exit 1
          }

          Write-Host ""

          foreach ($apk in $apks) {

            Write-Host "✓ APK FOUND"
            Write-Host "---------------------------------------"
            Write-Host "Path:"
            Write-Host $apk.FullName
            Write-Host ""
            Write-Host "Size:"
            Write-Host "$($apk.Length) bytes"
            Write-Host "---------------------------------------"
          }


      # =========================================================
      # 16. SHOW APK DIRECTORY
      # =========================================================

      - name: Show APK output directory
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "APK OUTPUT"
          Write-Host "======================================="

          if (Test-Path "UABEAvalonia.Android/bin/Release") {

            Get-ChildItem `
              "UABEAvalonia.Android/bin/Release" `
              -Recurse `
              -File |
              Where-Object {
                $_.Extension -eq ".apk"
              } |
              Select-Object FullName, Length

          }


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android
          path: |
            UABEAvalonia.Android/bin/Release/**/*.apk
          if-no-files-found: error
