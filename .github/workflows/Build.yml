name: Build UABEA Android

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build UABEA Android
    runs-on: windows-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. .NET 8
      # =========================================================

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # =========================================================
      # 4. ANDROID WORKLOAD
      # =========================================================

      - name: Install Android workload
        shell: pwsh
        run: |
          Write-Host "======================================="
          Write-Host "INSTALL ANDROID WORKLOAD"
          Write-Host "======================================="

          dotnet workload install android

          Write-Host ""
          Write-Host "Android workload selesai."


      # =========================================================
      # 5. BUAT FOLDER LIBS
      # =========================================================

      - name: Prepare Libs folder
        shell: pwsh
        run: |
          Write-Host "======================================="
          Write-Host "PREPARE LIBS"
          Write-Host "======================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "Libs"

          Write-Host "Libs folder siap."


      # =========================================================
      # 6. DOWNLOAD ASSETSTOOLS.NET
      # =========================================================

      - name: Download AssetsTools.NET
        shell: pwsh
        run: |

          Write-Host "======================================="
          Write-Host "DOWNLOAD ASSETSTOOLS.NET"
          Write-Host "======================================="

          $base =
            "https://github.com/nesrak1/UABEA/raw/master/Libs"

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.dll" `
            -OutFile "Libs/AssetsTools.NET.dll"

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.Cpp2IL.dll" `
            -OutFile "Libs/AssetsTools.NET.Cpp2IL.dll"

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.MonoCecil.dll" `
            -OutFile "Libs/AssetsTools.NET.MonoCecil.dll"

          Invoke-WebRequest `
            -Uri "$base/AssetsTools.NET.Texture.dll" `
            -OutFile "Libs/AssetsTools.NET.Texture.dll"

          Write-Host ""
          Write-Host "Download selesai."


      # =========================================================
      # 7. VERIFY DLL
      # =========================================================

      - name: Verify AssetsTools DLL
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY ASSETSTOOLS DLL"
          Write-Host "======================================="

          $required = @(
            "Libs/AssetsTools.NET.dll",
            "Libs/AssetsTools.NET.Cpp2IL.dll",
            "Libs/AssetsTools.NET.MonoCecil.dll",
            "Libs/AssetsTools.NET.Texture.dll"
          )

          $failed = $false

          foreach ($file in $required) {

            if (Test-Path $file) {

              $size =
                (Get-Item $file).Length

              Write-Host "✓ $file"
              Write-Host "  Size: $size bytes"

            }
            else {

              Write-Host "❌ MISSING: $file"

              $failed = $true
            }
          }

          if ($failed) {

            Write-Host ""
            Write-Host "DLL verification FAILED."

            exit 1
          }

          Write-Host ""
          Write-Host "✓ Semua DLL tersedia."


      # =========================================================
      # 8. SHOW PROJECT STRUCTURE
      # =========================================================

      - name: Show Android project
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "ANDROID PROJECT"
          Write-Host "======================================="

          if (Test-Path "UABEAvalonia.Android") {

            Get-ChildItem `
              "UABEAvalonia.Android" `
              -Recurse |
              Select-Object FullName

          }
          else {

            Write-Host "❌ UABEAvalonia.Android tidak ditemukan."

            exit 1
          }


      # =========================================================
      # 9. CHECK MAINACTIVITY
      # =========================================================

      - name: Verify MainActivity
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY MAINACTIVITY"
          Write-Host "======================================="

          $main =
            "UABEAvalonia.Android/MainActivity.cs"

          if (!(Test-Path $main)) {

            Write-Host "❌ MainActivity.cs tidak ditemukan."

            exit 1
          }

          Write-Host "✓ MainActivity.cs ditemukan."

          Write-Host ""
          Write-Host "Checking texture API..."

          $content =
            Get-Content $main -Raw

          if ($content.Contains("GetImageData")) {

            Write-Host ""
            Write-Host "❌ GetImageData masih ditemukan."

            Write-Host ""
            Write-Host "Cari dan hapus penggunaan GetImageData()."
            Write-Host "MainActivity sekarang harus menggunakan GetTextureData()."

            exit 1
          }

          if ($content.Contains("GetTextureData")) {

            Write-Host "✓ GetTextureData ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "⚠ GetTextureData tidak ditemukan."

            Write-Host ""
            Write-Host "Periksa MainActivity.cs."

            exit 1
          }


      # =========================================================
      # 10. CHECK TEXTURE DECODER
      # =========================================================

      - name: Check Texture Decoder reference
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "CHECK TEXTURE DECODER"
          Write-Host "======================================="

          $main =
            Get-Content `
              "UABEAvalonia.Android/MainActivity.cs" `
              -Raw

          if ($main.Contains("TextureFile.DecodeManaged")) {

            Write-Host "✓ TextureFile.DecodeManaged ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "⚠ TextureFile.DecodeManaged tidak ditemukan."

            Write-Host ""
            Write-Host "Ini perlu diperiksa sebelum build."
          }

          Write-Host ""
          Write-Host "✓ Texture decoder check selesai."


      # =========================================================
      # 11. CHECK CSPROJ
      # =========================================================

      - name: Verify Android csproj
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "VERIFY ANDROID CSPROJ"
          Write-Host "======================================="

          $csproj =
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj"

          if (!(Test-Path $csproj)) {

            Write-Host "❌ Android csproj tidak ditemukan."

            exit 1
          }

          Write-Host "✓ Android csproj ditemukan."

          Write-Host ""
          Write-Host "Texture DLL reference:"

          Select-String `
            -Path $csproj `
            -Pattern "AssetsTools.NET.Texture" `
            -SimpleMatch


      # =========================================================
      # 12. RESTORE
      # =========================================================

      - name: Restore Android project
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "DOTNET RESTORE"
          Write-Host "======================================="

          dotnet restore `
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj"


      # =========================================================
      # 13. BUILD
      # =========================================================

      - name: Build Android APK
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "BUILD UABEA ANDROID"
          Write-Host "======================================="

          dotnet build `
            "UABEAvalonia.Android/UABEAvalonia.Android.csproj" `
            -c Release `
            --no-restore


      # =========================================================
      # 14. SEARCH APK
      # =========================================================

      - name: Find APK
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "SEARCH APK"
          Write-Host "======================================="

          $apks =
            Get-ChildItem `
              -Path "." `
              -Recurse `
              -Filter "*.apk"

          if ($apks.Count -eq 0) {

            Write-Host "❌ APK tidak ditemukan."

            exit 1
          }

          foreach ($apk in $apks) {

            Write-Host ""
            Write-Host "✓ APK FOUND"
            Write-Host "Path : $($apk.FullName)"
            Write-Host "Size : $($apk.Length) bytes"
          }


      # =========================================================
      # 15. UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android
          path: |
            UABEAvalonia.Android/bin/Release/**/*.apk
          if-no-files-found: error
