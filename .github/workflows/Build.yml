name: Build UABEA Android Native APK

on:
  workflow_dispatch: # Membuat tombol manual di tab Actions GitHub untuk memulai build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Install Android Workload
      run: |
        dotnet workload install android

    - name: Restore Dependencies
      run: |
        # Memaksa restore hanya fokus pada satu target Android untuk memutus error bionic di UABEAvalonia
        dotnet restore AVALONIAAndroid/AVALONIANdroid.csproj -r android-arm64 /p:ValidateExecutableReferencesMatchSelfContained=false

    - name: Build Android Project
      run: |
        # Mengompilasi proyek dengan mematikan pengecekan target silang yang memicu error NETSDK1112
        dotnet publish AVALONIAAndroid/AVALONIANdroid.csproj -c Release -r android-arm64 --no-self-contained /p:AndroidPackageFormat=apk /p:AndroidBuildApplicationPackage=true /p:ValidateExecutableReferencesMatchSelfContained=false /p:EnsureRuntimePackDownloaded=false
