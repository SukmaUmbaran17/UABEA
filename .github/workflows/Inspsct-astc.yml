            "ASTC_RGB_8x8 = Format 51");
        Console.WriteLine(
            "switch index = 50");

        Console.WriteLine(
            "ASTC_RGBA_8x8 = Format 57");
        Console.WriteLine(
            "switch index = 56");

        Console.WriteLine(
            "ASTC_HDR_8x8 = Format 69");
        Console.WriteLine(
            "switch index = 68");

        Console.WriteLine();

        Console.WriteLine(
            "Target branch harus dicocokkan dengan IL");
        Console.WriteLine(
            "DecodeManaged() di atas.");
    }

    // ================================================================
    // OPCODE TABLES
    // ================================================================

    static readonly Dictionary<short, OpCode>
        OneByteOpCodes =
            BuildOneByteOpCodes();

    static readonly Dictionary<short, OpCode>
        TwoByteOpCodes =
            BuildTwoByteOpCodes();

    static Dictionary<short, OpCode>
        BuildOneByteOpCodes()
    {
        Dictionary<short, OpCode> result =
            new Dictionary<short, OpCode>();

        foreach (FieldInfo field
                 in typeof(OpCodes).GetFields(
                     BindingFlags.Public |
                     BindingFlags.Static))
        {
            if (field.GetValue(null)
                is OpCode opcode)
            {
                short value =
                    opcode.Value;

                if ((value & 0xFF00) == 0)
                    result[value] =
                        opcode;
            }
        }

        return result;
    }

    static Dictionary<short, OpCode>
        BuildTwoByteOpCodes()
    {
        Dictionary<short, OpCode> result =
            new Dictionary<short, OpCode>();

        foreach (FieldInfo field
                 in typeof(OpCodes).GetFields(
                     BindingFlags.Public |
                     BindingFlags.Static))
        {
            if (field.GetValue(null)
                is OpCode opcode)
            {
                short value =
                    opcode.Value;

                if ((value & 0xFF00) == unchecked((short)0xFE00))
                    result[value] =
                        opcode;
            }
        }

        return result;
    }
}
