name: Inspect AssetsTools.NET.Texture ASTC

on:
  workflow_dispatch:

jobs:
  inspect-astc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show project files
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"
          find . -maxdepth 4 -type f | sort

      - name: Build ASTC Inspector
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD ASTC INSPECTOR"
          echo "======================================"

          dotnet restore ASTCInspector/ASTCInspector.csproj

          dotnet build \
            ASTCInspector/ASTCInspector.csproj \
            -c Release \
            --no-restore

      - name: Locate AssetsTools.NET.Texture.dll
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCH DLL"
          echo "======================================"

          find . \
            -type f \
            -name "AssetsTools.NET.Texture.dll" \
            -print

      - name: Prepare DLL
        shell: bash
        run: |
          echo "======================================"
          echo "PREPARE DLL"
          echo "======================================"

          DLL=$(find . \
            -type f \
            -name "AssetsTools.NET.Texture.dll" \
            | head -n 1)

          if [ -z "$DLL" ]; then
            echo "ERROR: AssetsTools.NET.Texture.dll tidak ditemukan."
            exit 1
          fi

          echo "DLL ditemukan:"
          echo "$DLL"

          cp "$DLL" \
            ASTCInspector/bin/Release/net8.0/AssetsTools.NET.Texture.dll

      - name: Run ASTC Inspector
        shell: bash
        run: |
          echo "======================================"
          echo "ASSETS TOOLS TEXTURE IL INSPECTOR"
          echo "======================================"

          dotnet run \
            --project ASTCInspector/ASTCInspector.csproj \
            -c Release \
            --no-build \
            -- \
            "ASTCInspector/bin/Release/net8.0/AssetsTools.NET.Texture.dll"

      - name: Upload inspection result
        uses: actions/upload-artifact@v4
        with:
          name: ASTC-Inspector-Result
          path: |
            ASTCInspector/bin/Release/net8.0/
