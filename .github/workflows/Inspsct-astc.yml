            MethodInfo? decodeManaged =
                textureFileType.GetMethod(
                    "DecodeManaged",
                    BindingFlags.Public |
                    BindingFlags.NonPublic |
                    BindingFlags.Static |
                    BindingFlags.Instance);

            if (decodeManaged == null)
            {
                Console.WriteLine(
                    "❌ DecodeManaged tidak ditemukan.");

                return;
            }

            PrintSignature(decodeManaged);

            // ========================================================
            // 3. DUMP IL + RESOLVE METHOD TOKEN
            // ========================================================

            Console.WriteLine();
            Console.WriteLine("======================================");
            Console.WriteLine("DecodeManaged IL + METHOD RESOLUTION");
            Console.WriteLine("======================================");

            DumpIL(
                decodeManaged);

            // ========================================================
            // 4. CARI SEMUA DECODER
            // ========================================================

            Console.WriteLine();
            Console.WriteLine("======================================");
            Console.WriteLine("SEMUA TEXTURE DECODER");
            Console.WriteLine("======================================");

            PrintDecoderMethods(
                types);

            // ========================================================
            // 5. KHUSUS ASTC
            // ========================================================

            Console.WriteLine();
            Console.WriteLine("======================================");
            Console.WriteLine("ASTC DECODER METHODS");
            Console.WriteLine("======================================");

            PrintAstcMethods(
                types);

            // ========================================================
            // 6. ANALISIS FORMAT ASTC
            // ========================================================

            Console.WriteLine();
            Console.WriteLine("======================================");
            Console.WriteLine("ANALISIS ASTC FORMAT");
            Console.WriteLine("======================================");

            PrintAstcAnalysis(
                decodeManaged);

            // ========================================================
            // SELESAI
            // ========================================================

            Console.WriteLine();
            Console.WriteLine("======================================");
            Console.WriteLine("INSPEKSI SELESAI");
            Console.WriteLine("======================================");
        }
        catch (Exception ex)
