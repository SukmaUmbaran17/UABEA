    // ================================================================
    // SIGNATURE
    // ================================================================

    static void PrintSignature(
        MethodInfo method)
    {
        Console.WriteLine();
        Console.WriteLine(
            "[METHOD] " +
            method.DeclaringType?.FullName +
            "." +
            method.Name);

        Console.WriteLine(
            "Return: " +
            method.ReturnType.FullName);

        Console.WriteLine(
            "Static: " +
            method.IsStatic);

        Console.WriteLine(
            "Visibility: " +
            GetVisibility(method));

        Console.WriteLine(
            "Parameters:");

        foreach (ParameterInfo p
                 in method.GetParameters())
        {
            Console.WriteLine(
                "  " +
                p.Position +
                ": " +
                p.ParameterType.FullName +
                " " +
                p.Name);
        }
    }

    // ================================================================
    // VISIBILITY
    // ================================================================

    static string GetVisibility(
        MethodInfo method)
    {
        if (method.IsPublic)
            return "public";

        if (method.IsPrivate)
            return "private";

        if (method.IsFamily)
            return "protected";

        if (method.IsAssembly)
            return "internal";

        return "other";
    }

    // ================================================================
    // DUMP IL
    // ================================================================

    static void DumpIL(
        MethodInfo method)
    {
        Console.WriteLine();
        Console.WriteLine(
            "----- IL START -----");

        MethodBody? body;

        try
        {
            body =
                method.GetMethodBody();
        }
        catch (Exception ex)
        {
            Console.WriteLine(
                "GetMethodBody gagal: " +
                ex.Message);

            return;
        }

        if (body == null)
        {
            Console.WriteLine(
                "Method tidak memiliki IL body.");

            Console.WriteLine(
                "----- IL END -----");

            return;
        }

        byte[] il =
            body.GetILAsByteArray()
            ?? Array.Empty<byte>();

        Console.WriteLine(
            "IL Length: " +
            il.Length);

        Console.WriteLine();

        Module module =
            method.Module;

        int position = 0;

        while (position < il.Length)
        {
            int offset =
                position;

            ushort value =
                il[position++];

            OpCode opcode;

            if (value == 0xFE)
            {
                if (position >= il.Length)
                    break;

                ushort second =
                    il[position++];

                short twoByte =
                    unchecked(
                        (short)(
                            0xFE00 |
                            second));

                if (!TwoByteOpCodes.TryGetValue(
                        twoByte,
                        out opcode))
                {
                    Console.WriteLine(
                        offset.ToString("X4") +
                        ": UNKNOWN");

                    continue;
                }
            }
            else
            {
                if (!OneByteOpCodes.TryGetValue(
                        (short)value,
                        out opcode))
                {
                    Console.WriteLine(
                        offset.ToString("X4") +
                        ": UNKNOWN");

                    continue;
                }
            }

            object? operand = null;

            try
            {
                operand =
                    ReadOperand(
                        opcode,
                        il,
                        ref position,
                        module);
            }
            catch (Exception ex)
            {
                Console.WriteLine(
                    offset.ToString("X4") +
                    ": " +
                    opcode.Name +
                    " [operand error: " +
                    ex.Message +
                    "]");

                break;
            }

            Console.WriteLine(
                offset.ToString("X4") +
                ": " +
                opcode.Name +
                (
                    operand != null
                        ? " " + operand
                        : ""
                ));
        }

        Console.WriteLine(
            "----- IL END -----");
    }

    // ================================================================
    // OPERAND READER
    // ================================================================

    static object? ReadOperand(
        OpCode opcode,
        byte[] il,
        ref int position,
        Module module)
    {
        switch (opcode.OperandType)
        {
            case OperandType.InlineNone:
                return null;

            case OperandType.ShortInlineI:
                return
                    (sbyte)il[position++];

            case OperandType.InlineI:
                {
                    int value =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    return value;
                }

            case OperandType.InlineI8:
                {
                    long value =
                        BitConverter.ToInt64(
                            il,
                            position);

                    position += 8;

                    return value;
                }

            case OperandType.ShortInlineR:
                {
                    float value =
                        BitConverter.ToSingle(
                            il,
                            position);

                    position += 4;

                    return value;
                }

            case OperandType.InlineR:
                {
                    double value =
                        BitConverter.ToDouble(
                            il,
                            position);

                    position += 8;

                    return value;
                }

            case OperandType.ShortInlineBrTarget:
                {
                    sbyte delta =
                        (sbyte)il[position++];

                    int target =
                        position + delta;

                    return
                        "IL_" +
                        target.ToString("X4");
                }

            case OperandType.InlineBrTarget:
                {
                    int delta =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    int target =
                        position + delta;

                    return
                        "IL_" +
                        target.ToString("X4");
                }

            case OperandType.ShortInlineVar:
                return
                    "var_" +
                    il[position++];

            case OperandType.InlineVar:
                {
                    ushort index =
                        BitConverter.ToUInt16(
                            il,
                            position);

                    position += 2;

                    return
                        "var_" +
                        index;
                }

            case OperandType.InlineString:
                {
                    int token =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    try
                    {
                        return
                            "\"" +
                            module.ResolveString(token) +
                            "\"";
                    }
                    catch
                    {
                        return
                            "stringToken=0x" +
                            token.ToString("X8");
                    }
                }

            case OperandType.InlineMethod:
                {
                    int token =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    return ResolveMethodToken(
                        module,
                        token);
                }

            case OperandType.InlineField:
                {
                    int token =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    try
                    {
                        FieldInfo? field =
                            module.ResolveField(
                                token);

                        if (field != null)
                        {
                            return
                                "FIELD " +
                                field.DeclaringType?.FullName +
                                "." +
                                field.Name;
                        }
                    }
                    catch
                    {
                    }

                    return
                        "fieldToken=0x" +
                        token.ToString("X8");
                }

            case OperandType.InlineType:
                {
                    int token =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    try
                    {
                        Type? type =
                            module.ResolveType(
                                token);

                        if (type != null)
                            return
                                "TYPE " +
                                type.FullName;
                    }
                    catch
                    {
                    }

                    return
                        "typeToken=0x" +
                        token.ToString("X8");
                }

            case OperandType.InlineTok:
                {
                    int token =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    try
                    {
                        MemberInfo? member =
                            module.ResolveMember(
                                token);

                        if (member != null)
                        {
                            return
                                "TOKEN " +
                                member.DeclaringType?.FullName +
                                "." +
                                member.Name;
                        }
                    }
                    catch
                    {
                    }

                    return
                        "token=0x" +
                        token.ToString("X8");
                }

            case OperandType.InlineSwitch:
                {
                    int count =
                        BitConverter.ToInt32(
                            il,
                            position);

                    position += 4;

                    int basePosition =
                        position +
                        count * 4;

                    List<string> targets =
                        new List<string>();

                    for (int i = 0;
                         i < count;
                         i++)
                    {
                        int delta =
                            BitConverter.ToInt32(
                                il,
                                position);

                        position += 4;

                        int target =
                            basePosition +
                            delta;

                        targets.Add(
                            "IL_" +
                            target.ToString("X4"));
                    }

                    return
                        "[" +
                        string.Join(
                            ", ",
                            targets) +
                        "]";
                }

            default:
                return
                    "[unsupported operand]";
        }
    }

    // ================================================================
    // METHOD TOKEN RESOLVER
    // ================================================================

    static string ResolveMethodToken(
        Module module,
        int token)
    {
        try
        {
            MethodBase? method =
                module.ResolveMethod(token);

            if (method != null)
            {
                string declaring =
                    method.DeclaringType?.FullName
                    ?? "<unknown>";

                string parameters =
                    string.Join(
                        ", ",
                        method.GetParameters()
                            .Select(
                                p =>
                                    p.ParameterType.FullName
                                    ?? "?"));

                return
                    "METHOD 0x" +
                    token.ToString("X8") +
                    " => " +
                    declaring +
                    "." +
                    method.Name +
                    "(" +
                    parameters +
                    ")";
            }
        }
        catch (Exception ex)
        {
            return
                "METHOD 0x" +
                token.ToString("X8") +
                " => RESOLVE ERROR: " +
                ex.Message;
        }

        return
            "METHOD 0x" +
            token.ToString("X8");
    }

    // ================================================================
    // DECODER METHODS
    // ================================================================

    static void PrintDecoderMethods(
        Type[] types)
    {
        foreach (Type type in types
                     .OrderBy(t => t.FullName))
        {
            MethodInfo[] methods;

            try
            {
                methods =
                    type.GetMethods(
                        BindingFlags.Public |
                        BindingFlags.NonPublic |
                        BindingFlags.Static |
                        BindingFlags.Instance |
                        BindingFlags.DeclaredOnly);
            }
            catch
            {
                continue;
            }

            foreach (MethodInfo method in methods)
            {
                string name =
                    method.Name;

                string full =
                    (type.FullName ?? "") +
                    "." +
                    name;

                if (
                    name.IndexOf(
                        "Read",
                        StringComparison.OrdinalIgnoreCase) < 0
                    &&
                    name.IndexOf(
                        "Decode",
                        StringComparison.OrdinalIgnoreCase) < 0)
                {
                    continue;
                }

                if (
                    full.IndexOf(
                        "Texture",
                        StringComparison.OrdinalIgnoreCase) >= 0
                    ||
                    full.IndexOf(
                        "Decoder",
                        StringComparison.OrdinalIgnoreCase) >= 0
                    ||
                    full.IndexOf(
                        "ASTC",
                        StringComparison.OrdinalIgnoreCase) >= 0)
                {
                    Console.WriteLine();
                    Console.WriteLine(
                        "[DECODER] " +
                        full);

                    PrintSignature(method);
                }
            }
        }
    }

    // ================================================================
    // ASTC METHODS
    // ================================================================

    static void PrintAstcMethods(
        Type[] types)
    {
        bool found = false;

        foreach (Type type in types
                     .OrderBy(t => t.FullName))
        {
            MethodInfo[] methods;

            try
            {
                methods =
                    type.GetMethods(
                        BindingFlags.Public |
                        BindingFlags.NonPublic |
                        BindingFlags.Static |
                        BindingFlags.Instance |
                        BindingFlags.DeclaredOnly);
            }
            catch
            {
                continue;
            }

            foreach (MethodInfo method in methods)
            {
                string full =
                    (type.FullName ?? "") +
                    "." +
                    method.Name;

                if (
                    full.IndexOf(
                        "ASTC",
                        StringComparison.OrdinalIgnoreCase) >= 0)
                {
                    found = true;

                    Console.WriteLine();
                    Console.WriteLine(
                        "[ASTC] " +
                        full);

                    PrintSignature(method);

                    DumpIL(method);
                }
            }
        }

        if (!found)
        {
            Console.WriteLine();
            Console.WriteLine(
                "⚠ Tidak ditemukan method dengan nama ASTC.");
        }
    }

