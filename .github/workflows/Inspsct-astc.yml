name: Inspect AssetsTools.NET.Texture ASTC

on:
  workflow_dispatch:

jobs:
  inspect-astc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find ASTC Inspector project
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCH ASTC INSPECTOR PROJECT"
          echo "======================================"

          find . \
            -type f \
            -name "ASTCInspector.csproj" \
            -print

      - name: Build ASTC Inspector
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD ASTC INSPECTOR"
          echo "======================================"

          PROJECT=$(find . \
            -type f \
            -name "ASTCInspector.csproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ASTCInspector.csproj tidak ditemukan."
            echo ""
            echo "Daftar file project:"
            find . -type f -name "*.csproj" -print
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT"

          dotnet restore "$PROJECT"

          dotnet build \
            "$PROJECT" \
            -c Release \
            --no-restore

      - name: Find AssetsTools.NET.Texture.dll
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCH AssetsTools.NET.Texture.dll"
          echo "======================================"

          find . \
            -type f \
            -name "AssetsTools.NET.Texture.dll" \
            -print

      - name: Run ASTC Inspector
        shell: bash
        run: |
          echo "======================================"
          echo "RUN ASTC INSPECTOR"
          echo "======================================"

          PROJECT=$(find . \
            -type f \
            -name "ASTCInspector.csproj" \
            | head -n 1)

          DLL=$(find . \
            -type f \
            -name "AssetsTools.NET.Texture.dll" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ASTCInspector.csproj tidak ditemukan."
            exit 1
          fi

          if [ -z "$DLL" ]; then
            echo "ERROR: AssetsTools.NET.Texture.dll tidak ditemukan."
            exit 1
          fi

          echo "PROJECT:"
          echo "$PROJECT"

          echo ""
          echo "DLL:"
          echo "$DLL"

          dotnet run \
            --project "$PROJECT" \
            -c Release \
            --no-build \
            -- "$DLL"

      - name: Upload ASTC Inspector
        uses: actions/upload-artifact@v4
        with:
          name: ASTC-Inspector-Result
          path: |
            .
