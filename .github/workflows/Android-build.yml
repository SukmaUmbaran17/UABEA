name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # LANGKAH FORCE: Membuat file .csproj yang benar langsung di lokasi yang dicari server
    - name: Force Create Correct Android Project File
      run: |
        New-Item -ItemType Directory -Force -Path "UABEAvalonia.Android"
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <ProjectReference Include="..\UABEAvalonia\UABEAvalonia.csproj" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAvalonia.Android\UABEAvalonia.Android.csproj" -Encoding utf8

    # Menghapus --retry-limit agar MSBuild Windows tidak bingung
    - name: Restore Dependencies (With Retry)
      run: |
        dotnet restore UABEAvalonia.Android\UABEAvalonia.Android.csproj
        

    - name: Compile APK
      run: |
        dotnet publish UABEAvalonia.Android\UABEAvalonia.Android.csproj -c Release -f net8.0-android34.0 --no-restore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: UABEAvalonia.Android\bin\Release\net8.0-android34.0\*Signed.apk
        
