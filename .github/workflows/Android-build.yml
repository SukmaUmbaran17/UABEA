name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # 1. MEMUSNAHKAN BOS TERAKHIR (.slnx) agar server tidak bisa mengunci mode desktop lagi
    - name: Wipe All Desktop Interventions
      run: |
        if (Test-Path "UABEAvalonia.sln") { Remove-Item "UABEAvalonia.sln" -Force }
        if (Test-Path "UABEAvaloniaMurni.slnx") { Remove-Item "UABEAvaloniaMurni.slnx" -Force }
        if (Test-Path "UABEAvalonia") { Remove-Item "UABEAvalonia" -Recurse -Force }
        New-Item -ItemType Directory -Force -Path "UABEAndroidMurni"

    # 2. Membuat file Proyek Android Resmi yang bersih
    - name: Create Clean Android Project
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAndroidMurni\UABEAndroidMurni.csproj" -Encoding utf8

    # 3. Membuat file kode pemicu (Main) kosong yang wajib ada di aplikasi Android
    - name: Create Dummy MainActivity
      run: |
        New-Item -ItemType Directory -Force -Path "UABEAndroidMurni\Properties"
        @'
        using Android.App;
        using Android.Content.PM;
        using Avalonia.Android;

        namespace UABEAndroidMurni;

        [Activity(Label = "UABE Android", DocumentLaunchMode = DocumentLaunchMode.Always, MainLauncher = true, ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.ScreenSize | ConfigChanges.UiMode)]
        public class MainActivity : AvaloniaMainActivity
        {
        }
        '@ | Out-File -FilePath "UABEAndroidMurni\MainActivity.cs" -Encoding utf8

    # 4. Membuat file Solusi (.sln) baru yang murni mobile
    - name: Generate Official Mobile Solution File
      run: |
        dotnet new sln -n UABEAndroidMurni
        dotnet sln add UABEAndroidMurni/UABEAndroidMurni.csproj

    # 5. Melakukan Restore murni tanpa intervensi berkas .slnx desktop bawaan
    - name: Restore Dependencies
      run: |
        dotnet restore -p:CheckEolWorkloads=false --force

    # 6. Merakit seluruh berkas lewat jalur Solusi Resmi menjadi file APK
    - name: Compile APK
      run: |
        dotnet publish -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # 7. Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: UABEAndroidMurni\bin\Release\net8.0-android\*Signed.apk
        
