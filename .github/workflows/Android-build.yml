name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ] # Memicu otomatis di branch master atau main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest # DIUBAH KE WINDOWS karena SDK .NET Android jauh lebih stabil tanpa error sertifikat NuGet

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    # Memasang .NET SDK versi 8 yang stabil
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Memasang Workload Android versi spesifik agar tidak memicu error "Out of support"
    - name: Install Android Workload
      run: dotnet workload install android --include-pre-releases

    - name: Restore Dependencies
      run: dotnet restore UABEAvalonia/UABEAvalonia.Android/UABEAvalonia.Android.csproj

    - name: Compile APK
      run: |
        dotnet publish UABEAvalonia/UABEAvalonia.Android/UABEAvalonia.Android.csproj -c Release -f net8.0-android --no-restore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: UABEAvalonia/UABEAvalonia.Android/bin/Release/net8.0-android/*-Signed.apk
        
