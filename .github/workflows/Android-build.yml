name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # TAKTIK PARIPURNA: Mengunci target Android 34 secara global untuk seluruh proyek lewat Directory.Build.props
    - name: Force Global Framework Override
      run: |
        @'
        <Project>
          <PropertyGroup>
            <!-- Jika proyek mendeteksi target Android, paksa kunci ke versi API 34.0 dan matikan API 21 -->
            <TargetFrameworks Condition="$(TargetFrameworks) == '' and '$(TargetFramework)' == ''">net8.0-android34.0</TargetFrameworks>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
        </Project>
        '@ | Out-File -FilePath "Directory.Build.props" -Encoding utf8

    # Membuat file proyek aplikasi mobile mandiri di folder terisolasi
    - name: Create Isolated Android Project Folder
      run: |
        New-Item -ItemType Directory -Force -Path "MobileAppIsolated"
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <ProjectReference Include="..\UABEAvalonia\UABEAvalonia.csproj" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "MobileAppIsolated\UABEAvaloniaAndroidApp.csproj" -Encoding utf8

    # Melakukan Restore dengan pembersihan cache total
    - name: Restore Dependencies
      run: |
        dotnet restore MobileAppIsolated\UABEAvaloniaAndroidApp.csproj --force

    # Merakit kode biner menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish MobileAppIsolated\UABEAvaloniaAndroidApp.csproj -c Release -f net8.0-android34.0 --no-restore

    # Mengunggah berkas APK hasil kompilasi akhir
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: MobileAppIsolated\bin\Release\net8.0-android34.0\*Signed.apk
        
