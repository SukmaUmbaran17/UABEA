name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # KITA BUAT FOLDER TERISOLASI AGAR SISTEM .NET TIDAK BISA MENGINTIP FILE .SLN DESKTOP
    - name: Create Isolated Android Project Folder
      run: |
        New-Item -ItemType Directory -Force -Path "MobileAppIsolated"
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <!-- Melompat satu folder keluar untuk mengambil logika inti UABEA asli -->
            <ProjectReference Include="..\UABEAvalonia\UABEAvalonia.csproj" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "MobileAppIsolated\UABEAvaloniaAndroidApp.csproj" -Encoding utf8

    # RESTORE DI FOLDER TERISOLASI
    - name: Restore Dependencies
      run: |
        dotnet restore MobileAppIsolated\UABEAvaloniaAndroidApp.csproj -p:CheckEolWorkloads=false --force

    # MERAKIT LANGSUNG MENJADI APK
    - name: Compile APK
      run: |
        dotnet publish MobileAppIsolated\UABEAvaloniaAndroidApp.csproj -c Release -f net8.0-android34.0 --no-restore -p:CheckEolWorkloads=false

    # MENGUNGGAH FILE APK HASIL COMPILE
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: MobileAppIsolated\bin\Release\net8.0-android34.0\*Signed.apk
        
