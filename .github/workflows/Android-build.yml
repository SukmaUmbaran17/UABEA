name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # KITA KEMBALIKAN SDK STANDAR TAPI KUNCI TARGET LEWAT RUNTIME IDENTIFIER DAN TARGETPLATFORMIDENTIFIER
    - name: Create Self-Contained Android Project File
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <TargetPlatformIdentifier>android</TargetPlatformIdentifier>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            
            <!-- Memasukkan file C# dan aset XAML secara terisolasi -->
            <Compile Include="UABEAvalonia\**\*.cs" />
            <AvaloniaResource Include="UABEAvalonia\**\*.axaml" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAvaloniaAndroidDirect.csproj" -Encoding utf8

    # Melakukan Restore dengan penguncian target framework mobile secara mutlak
    - name: Restore Dependencies
      run: |
        dotnet restore UABEAvaloniaAndroidDirect.csproj -p:TargetFramework=net8.0-android34.0 -p:CheckEolWorkloads=false --force

    # Merakit seluruh berkas menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish UABEAvaloniaAndroidDirect.csproj -c Release -f net8.0-android34.0 --no-restore -p:CheckEolWorkloads=false

    # Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android34.0\*Signed.apk
        
