name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # TAKTIK PARIPURNA: Mengisolasi file sumber dan menghapus total berkas PC dari server
    - name: Clean and Isolate Mobile Source
      run: |
        # Buat folder bersih khusus aplikasi Android
        New-Item -ItemType Directory -Force -Path "UABEAndroidApp"
        New-Item -ItemType Directory -Force -Path "UABEAndroidApp\SourceCode"
        
        # Pindahkan file kode inti (.cs) dan desain (.axaml) ke dalam zona steril Android
        Copy-Item -Path "UABEAvalonia\**\*.cs" -Destination "UABEAndroidApp\SourceCode" -Recurse -Force
        Copy-Item -Path "UABEAvalonia\**\*.axaml" -Destination "UABEAndroidApp\SourceCode" -Recurse -Force
        
        # HAPUS TOTAL seluruh sisa file bawaan komputer agar compiler tidak bisa mengintip setelan PC
        Remove-Item "UABEAvalonia.sln" -Force -ErrorAction SilentlyContinue
        Remove-Item "UABEAvalonia" -Recurse -Force -ErrorAction SilentlyContinue

    # Membuat berkas manifest identitas Android di folder baru
    - name: Create Isolated Android Manifest
      run: |
        New-Item -ItemType Directory -Force -Path "UABEAndroidApp\Properties"
        @'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.sukma.uabea.android" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
            <application android:label="UABE Android" android:allowBackup="true">
            </application>
        </manifest>
        '@ | Out-File -FilePath "UABEAndroidApp\Properties\AndroidManifest.xml" -Encoding utf8

    # Membuat file proyek Android murni di dalam folder steril
    - name: Create Isolated Android Project File
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <Compile Include="SourceCode\**\*.cs" />
            <AvaloniaResource Include="SourceCode\**\*.axaml" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAndroidApp\UABEAndroidApp.csproj" -Encoding utf8

    # Melakukan Restore murni di lingkungan steril tanpa gangguan file biner komputer
    - name: Restore Dependencies
      run: |
        dotnet restore UABEAndroidApp\UABEAndroidApp.csproj -p:CheckEolWorkloads=false --force

    # Merakit seluruh berkas menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish UABEAndroidApp\UABEAndroidApp.csproj -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: UABEAndroidApp\bin\Release\net8.0-android\*Signed.apk
        
