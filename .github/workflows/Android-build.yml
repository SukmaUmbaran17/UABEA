name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # TAKTIK SAKTI: Memaksa file proyek induk (Desktop) untuk menerima target biner Android modern
    - name: Patch Parent Project Framework
      run: |
        $path = "UABEAvalonia\UABEAvalonia.csproj"
        $content = Get-Content $path
        # Menyisipkan target Android ke dalam struktur utama proyek induk agar sinkron
        $content = $content -replace "<TargetFrameworks>net8.0</TargetFrameworks>", "<TargetFrameworks>net8.0;net8.0-android34.0</TargetFrameworks>"
        $content | Out-File $path -Encoding utf8

    # Membuat file proyek aplikasi mobile mandiri
    - name: Create Isolated Android Project Folder
      run: |
        New-Item -ItemType Directory -Force -Path "MobileAppIsolated"
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <ProjectReference Include="..\UABEAvalonia\UABEAvalonia.csproj" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "MobileAppIsolated\UABEAvaloniaAndroidApp.csproj" -Encoding utf8

    # Melakukan Restore dengan penguncian parameter global di seluruh arsitektur proyek
    - name: Restore Dependencies
      run: |
        dotnet restore MobileAppIsolated\UABEAvaloniaAndroidApp.csproj -p:TargetFramework=net8.0-android34.0 -p:CheckEolWorkloads=false --force

    # Merakit kode biner menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish MobileAppIsolated\UABEAvaloniaAndroidApp.csproj -c Release -f net8.0-android34.0 --no-restore -p:CheckEolWorkloads=false

    # Mengunggah berkas APK yang sudah ditandatangani otomatis
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: MobileAppIsolated\bin\Release\net8.0-android34.0\*Signed.apk
        
