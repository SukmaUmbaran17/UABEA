name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # KITA PAKSA BUAT FILE .CSPROJ DI ROOT (FOLDER UTAMA) AGAR TIDAK BISA DIABAIKAN SERVER
    - name: Force Create Android Project File
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android34.0</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <ProjectReference Include="UABEAvalonia\UABEAvalonia.csproj" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAvaloniaAndroidApp.csproj" -Encoding utf8

    # Menjalankan Restore langsung menunjuk file proyek mandiri di luar Solution asli
    - name: Restore Dependencies
      run: |
        dotnet restore UABEAvaloniaAndroidApp.csproj

    # Mengompilasi langsung file proyek tersebut
    - name: Compile APK
      run: |
        dotnet publish UABEAvaloniaAndroidApp.csproj -c Release -f net8.0-android34.0 --no-restore

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android34.0\*Signed.apk
        
