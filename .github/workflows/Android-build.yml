name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # 1. Hapus intervensi berkas desktop lama
    - name: Remove Desktop Interventions
      run: |
        if (Test-Path "UABEAvalonia.sln") { Remove-Item "UABEAvalonia.sln" -Force }
        if (Test-Path "UABEAvalonia\UABEAvalonia.csproj") { Remove-Item "UABEAvalonia\UABEAvalonia.csproj" -Force }

    # 2. FORCE MANIFEST: Membuat identitas Android asli agar compiler .NET tidak bisa mengelak
    - name: Force Create Android Manifest
      run: |
        New-Item -ItemType Directory -Force -Path "Properties"
        @'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.sukma.uabea.android" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
            <application android:label="UABE Android" android:allowBackup="true" android:icon="@mipmap/ic_launcher">
            </application>
        </manifest>
        '@ | Out-File -FilePath "Properties\AndroidManifest.xml" -Encoding utf8

    # 3. Membuat berkas proyek Android mandiri
    - name: Create Self-Contained Android Project File
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <Compile Include="UABEAvalonia\**\*.cs" />
            <AvaloniaResource Include="UABEAvalonia\**\*.axaml" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAvaloniaAndroidDirect.csproj" -Encoding utf8

    # 4. Melakukan Restore murni dengan identitas Android yang sudah valid
    - name: Restore Dependencies
      run: |
        dotnet restore UABEAvaloniaAndroidDirect.csproj -p:CheckEolWorkloads=false --force

    # 5. Merakit seluruh berkas menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish UABEAvaloniaAndroidDirect.csproj -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # 6. Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android\*Signed.apk
        
