name: Build UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # TAKTIK PARIPURNA: Hapus file solusi dan file proyek desktop agar tidak memicu error bentrokan
    - name: Remove Desktop Interventions
      run: |
        if (Test-Path "UABEAvalonia.sln") { Remove-Item "UABEAvalonia.sln" -Force }
        if (Test-Path "UABEAvalonia\UABEAvalonia.csproj") { Remove-Item "UABEAvalonia\UABEAvalonia.csproj" -Force }

    # Membuat proyek Android murni tanpa ketergantungan berkas luar
    - name: Create Self-Contained Android Project File
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Exe</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <ApplicationVersion>1</ApplicationVersion>
            <ApplicationDisplayVersion>1.0</ApplicationDisplayVersion>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            
            <!-- Mengambil paksa seluruh file kode C# dan aset XAML dari folder UABEAvalonia asli -->
            <Compile Include="UABEAvalonia\**\*.cs" />
            <AvaloniaResource Include="UABEAvalonia\**\*.axaml" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAvaloniaAndroidDirect.csproj" -Encoding utf8

    # Melakukan Restore murni tanpa gangguan file solusi desktop bawaan
    - name: Restore Dependencies
      run: |
        dotnet restore UABEAvaloniaAndroidDirect.csproj -p:CheckEolWorkloads=false --force

    # Merakit seluruh berkas menjadi aplikasi APK utuh
    - name: Compile APK
      run: |
        dotnet publish UABEAvaloniaAndroidDirect.csproj -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android\*Signed.apk
        
