name: Inspect AssetsTools.NET.Texture

on:
  workflow_dispatch:
  push:
    paths:
      - "AssetsTools.NET.Texture.dll"
      - "DllInspector/**"
      - ".github/workflows/**"

jobs:
  inspect-texture-dll:
    runs-on: windows-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: CHECKOUT
        uses: actions/checkout@v4

      # ==========================================
      # SETUP .NET
      # ==========================================

      - name: SETUP DOTNET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ==========================================
      # CHECK DLL
      # ==========================================

      - name: VERIFY DLL
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "VERIFY ASSETS TOOLS TEXTURE DLL"
          Write-Host "======================================"

          $dll = "DllInspector/AssetsTools.NET.Texture.dll"

          if (!(Test-Path $dll)) {
              Write-Host ""
              Write-Host "❌ DLL TIDAK DITEMUKAN:"
              Write-Host $dll
              exit 1
          }

          Write-Host ""
          Write-Host "✓ DLL ditemukan:"
          Write-Host $dll

          $file = Get-Item $dll

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

      # ==========================================
      # CREATE INSPECTOR PROJECT
      # ==========================================

      - name: CREATE INSPECTOR
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "CREATE DLL INSPECTOR"
          Write-Host "======================================"

          if (!(Test-Path "DllInspector")) {
              New-Item `
                -ItemType Directory `
                -Path "DllInspector" `
                | Out-Null
          }

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>

          </Project>
          '@ | Set-Content "DllInspector/DllInspector.csproj"

      # ==========================================
      # CREATE INSPECTOR PROGRAM
      # ==========================================

      - name: CREATE INSPECTOR PROGRAM
        shell: pwsh
        run: |

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;

          string dllPath = Path.GetFullPath(
              "AssetsTools.NET.Texture.dll"
          );

          Console.WriteLine("======================================");
          Console.WriteLine("ASSEMBLY");
          Console.WriteLine("======================================");

          Console.WriteLine(dllPath);

          Assembly assembly = Assembly.LoadFrom(dllPath);

          Console.WriteLine();
          Console.WriteLine("Full Name:");
          Console.WriteLine(assembly.FullName);

          // ==========================================
          // REFERENCES
          // ==========================================

          Console.WriteLine();
          Console.WriteLine("======================================");
          Console.WriteLine("REFERENCES");
          Console.WriteLine("======================================");

          foreach (
              AssemblyName reference
              in assembly.GetReferencedAssemblies()
                  .OrderBy(r => r.Name)
          )
          {
              Console.WriteLine(
                  $"{reference.Name} | {reference.Version}"
              );
          }

          // ==========================================
          // TYPES
          // ==========================================

          Console.WriteLine();
          Console.WriteLine("======================================");
          Console.WriteLine("TYPES");
          Console.WriteLine("======================================");

          foreach (
              Type type
              in assembly.GetTypes()
                  .OrderBy(t => t.FullName)
          )
          {
              Console.WriteLine();
              Console.WriteLine("[TYPE]");
              Console.WriteLine(type.FullName);

              // ==========================================
              // FIELDS
              // ==========================================

              FieldInfo[] fields = type.GetFields(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (fields.Length > 0)
              {
                  Console.WriteLine("  [FIELDS]");

                  foreach (
                      FieldInfo field
                      in fields.OrderBy(f => f.Name)
                  )
                  {
                      Console.WriteLine(
                          $"    {field.FieldType.Name} {field.Name}"
                      );
                  }
              }

              // ==========================================
              // PROPERTIES
              // ==========================================

              PropertyInfo[] properties = type.GetProperties(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (properties.Length > 0)
              {
                  Console.WriteLine("  [PROPERTIES]");

                  foreach (
                      PropertyInfo property
                      in properties.OrderBy(p => p.Name)
                  )
                  {
                      Console.WriteLine(
                          $"    {property.PropertyType.Name} {property.Name}"
                      );
                  }
              }

              // ==========================================
              // METHODS
              // ==========================================

              MethodInfo[] methods = type.GetMethods(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (methods.Length > 0)
              {
                  Console.WriteLine("  [METHODS]");

                  foreach (
                      MethodInfo method
                      in methods.OrderBy(m => m.Name)
                  )
                  {
                      string parameters = string.Join(
                          ", ",
                          method.GetParameters()
                              .Select(p =>
                                  $"{p.ParameterType.Name} {p.Name}"
                              )
                      );

                      Console.WriteLine(
                          $"    {method.ReturnType.Name} " +
                          $"{method.Name}({parameters})"
                      );
                  }
              }
          }
          '@ | Set-Content "DllInspector/Program.cs"

      # ==========================================
      # COPY DLL
      # ==========================================

      - name: COPY DLL
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "COPY DLL"
          Write-Host "======================================"

          Copy-Item `
            "DllInspector/AssetsTools.NET.Texture.dll" `
            "DllInspector/AssetsTools.NET.Texture.dll" `
            -Force

          Write-Host "✓ DLL siap diinspeksi"

      # ==========================================
      # BUILD INSPECTOR
      # ==========================================

      - name: BUILD INSPECTOR
        shell: pwsh
        working-directory: DllInspector
        run: |
          Write-Host "======================================"
          Write-Host "BUILD INSPECTOR"
          Write-Host "======================================"

          dotnet build -c Release

      # ==========================================
      # RUN INSPECTOR
      # ==========================================

      - name: RUN DLL INSPECTOR
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host "======================================"
          Write-Host "RUN DLL INSPECTOR"
          Write-Host "======================================"

          dotnet run > output.txt

          Write-Host ""
          Write-Host "✓ INSPECTION SELESAI"

      # ==========================================
      # SEARCH ASTC
      # ==========================================

      - name: SEARCH ASTC REFERENCES
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ASTC REFERENCES"
          Write-Host "======================================"

          $result = Select-String `
            -Path "output.txt" `
            -Pattern "ASTC" `
            -Context 5,10

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host ""
              Write-Host "❌ Tidak ditemukan referensi ASTC."
          }

      # ==========================================
      # SEARCH DECODERS
      # ==========================================

      - name: SEARCH ALL DECODERS
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ALL DECODER TYPES"
          Write-Host "======================================"

          $result = Select-String `
            -Path "output.txt" `
            -Pattern "Decoder|Decoders" `
            -Context 2,15

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host ""
              Write-Host "❌ Tidak ditemukan Decoder."
          }

      # ==========================================
      # SEARCH TEXTURE FILE
      # ==========================================

      - name: SEARCH TEXTUREFILE
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "TEXTUREFILE / DECODEMANAGED"
          Write-Host "======================================"

          $result = Select-String `
            -Path "output.txt" `
            -Pattern "TextureFile|DecodeManaged" `
            -Context 5,15

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host ""
              Write-Host "❌ TextureFile / DecodeManaged tidak ditemukan."
          }

      # ==========================================
      # SEARCH PVRTEXLIB
      # ==========================================

      - name: SEARCH PVRTEXLIB
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "PVRTEXLIB / PINVOKE"
          Write-Host "======================================"

          $result = Select-String `
            -Path "output.txt" `
            -Pattern "PVRTexLib|PInvoke" `
            -Context 5,10

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host ""
              Write-Host "❌ PVRTexLib / PInvoke tidak ditemukan."
          }

      # ==========================================
      # SAVE COMPLETE OUTPUT
      # ==========================================

      - name: UPLOAD INSPECTION RESULT
        uses: actions/upload-artifact@v4
        with:
          name: AssetsTools-NET-Texture-Inspection
          path: DllInspector/output.txt
