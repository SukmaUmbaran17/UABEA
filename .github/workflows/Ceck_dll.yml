name: check dll

on:
  workflow_dispatch:

jobs:
  build-android:
    name: check dll
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check DLL file
        shell: pwsh
        run: |
          $dll = "Libs/AssetsTools.NET.Texture.dll"

          if (!(Test-Path $dll)) {
            Write-Error "DLL tidak ditemukan: $dll"
            exit 1
          }

          $file = Get-Item $dll

          Write-Host "======================================"
          Write-Host "FILE INFORMATION"
          Write-Host "======================================"
          Write-Host "Name : $($file.Name)"
          Write-Host "Size : $($file.Length) bytes"
          Write-Host "Path : $($file.FullName)"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SHA256"
          Write-Host "======================================"

          Get-FileHash $dll -Algorithm SHA256

      - name: Create inspector project
        shell: pwsh
        run: |
          dotnet new console -n DllInspector

      - name: Copy DLL files
        shell: pwsh
        run: |
          Copy-Item "Libs/AssetsTools.NET.Texture.dll" "DllInspector/"
          Copy-Item "Libs/AssetsTools.NET.dll" "DllInspector/"

      - name: Create inspector code
        shell: pwsh
        run: |
          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;

          string dllPath = Path.GetFullPath(
              "AssetsTools.NET.Texture.dll"
          );

          Console.WriteLine("======================================");
          Console.WriteLine("ASSEMBLY");
          Console.WriteLine("======================================");

          Console.WriteLine(dllPath);

          Assembly assembly = Assembly.LoadFrom(dllPath);

          Console.WriteLine();
          Console.WriteLine("Full Name:");
          Console.WriteLine(assembly.FullName);

          Console.WriteLine();
          Console.WriteLine("======================================");
          Console.WriteLine("TYPES");
          Console.WriteLine("======================================");

          foreach (Type type in assembly.GetTypes()
              .OrderBy(t => t.FullName))
          {
              Console.WriteLine();
              Console.WriteLine("[TYPE]");
              Console.WriteLine(type.FullName);

              // ==========================================
              // FIELDS
              // ==========================================

              FieldInfo[] fields = type.GetFields(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (fields.Length > 0)
              {
                  Console.WriteLine("  [FIELDS]");

                  foreach (FieldInfo field in fields
                      .OrderBy(f => f.Name))
                  {
                      Console.WriteLine(
                          $"    {field.FieldType.Name} {field.Name}"
                      );
                  }
              }

              // ==========================================
              // PROPERTIES
              // ==========================================

              PropertyInfo[] properties = type.GetProperties(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (properties.Length > 0)
              {
                  Console.WriteLine("  [PROPERTIES]");

                  foreach (PropertyInfo property in properties
                      .OrderBy(p => p.Name))
                  {
                      Console.WriteLine(
                          $"    {property.PropertyType.Name} {property.Name}"
                      );
                  }
              }

              // ==========================================
              // METHODS
              // ==========================================

              MethodInfo[] methods = type.GetMethods(
                  BindingFlags.Public |
                  BindingFlags.NonPublic |
                  BindingFlags.Instance |
                  BindingFlags.Static |
                  BindingFlags.DeclaredOnly
              );

              if (methods.Length > 0)
              {
                  Console.WriteLine("  [METHODS]");

                  foreach (MethodInfo method in methods
                      .OrderBy(m => m.Name))
                  {
                      string parameters = string.Join(
                          ", ",
                          method.GetParameters()
                              .Select(p =>
                                  $"{p.ParameterType.Name} {p.Name}")
                      );

                      Console.WriteLine(
                          $"    {method.ReturnType.Name} " +
                          $"{method.Name}({parameters})"
                      );
                  }
              }
          }
          '@ | Set-Content DllInspector/Program.cs

      - name: Run DLL inspector
        working-directory: DllInspector
        run: dotnet run
