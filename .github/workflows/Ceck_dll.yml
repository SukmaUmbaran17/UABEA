name: Inspect AssetsTools Texture

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: CHECKOUT
        uses: actions/checkout@v4

      # ==========================================
      # SETUP DOTNET
      # ==========================================

      - name: SETUP DOTNET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ==========================================
      # FIND REQUIRED DLLS
      # ==========================================

      - name: FIND REQUIRED DLLS
        shell: pwsh
        run: |

          Write-Host "======================================"
          Write-Host "SEARCH REQUIRED DLLS"
          Write-Host "======================================"

          $textureDlls = Get-ChildItem `
            -Path . `
            -Filter "AssetsTools.NET.Texture.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          $assetsDlls = Get-ChildItem `
            -Path . `
            -Filter "AssetsTools.NET.dll" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "TEXTURE DLL:"
          $textureDlls | ForEach-Object {
              Write-Host $_.FullName
          }

          Write-Host ""
          Write-Host "ASSETS DLL:"
          $assetsDlls | ForEach-Object {
              Write-Host $_.FullName
          }

          if ($textureDlls.Count -eq 0) {
              Write-Host ""
              Write-Host "❌ AssetsTools.NET.Texture.dll tidak ditemukan."
              exit 1
          }

          if ($assetsDlls.Count -eq 0) {
              Write-Host ""
              Write-Host "❌ AssetsTools.NET.dll tidak ditemukan."
              exit 1
          }

          # ==========================================
          # CREATE INSPECTOR
          # ==========================================

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DllInspector" |
            Out-Null

          Copy-Item `
            $textureDlls[0].FullName `
            "DllInspector/AssetsTools.NET.Texture.dll" `
            -Force

          Copy-Item `
            $assetsDlls[0].FullName `
            "DllInspector/AssetsTools.NET.dll" `
            -Force

          Write-Host ""
          Write-Host "======================================"
          Write-Host "COPIED DLLS"
          Write-Host "======================================"

          Get-ChildItem DllInspector/*.dll |
            ForEach-Object {
                Write-Host $_.Name
            }

      # ==========================================
      # CREATE PROJECT
      # ==========================================

      - name: CREATE INSPECTOR PROJECT
        shell: pwsh
        run: |

          @'
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>

          </Project>
          '@ | Set-Content `
            "DllInspector/DllInspector.csproj"

      # ==========================================
      # CREATE PROGRAM
      # ==========================================

      - name: CREATE INSPECTOR PROGRAM
        shell: pwsh
        run: |

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;

          string dllPath = Path.GetFullPath(
              "AssetsTools.NET.Texture.dll"
          );

          Console.WriteLine(
              "======================================"
          );

          Console.WriteLine(
              "ASSETS TOOLS TEXTURE INSPECTOR"
          );

          Console.WriteLine(
              "======================================"
          );

          Console.WriteLine();

          Console.WriteLine(
              "DLL: " + dllPath
          );

          Assembly assembly =
              Assembly.LoadFrom(dllPath);

          Console.WriteLine();

          Console.WriteLine(
              "Full Name:"
          );

          Console.WriteLine(
              assembly.FullName
          );

          // ==========================================
          // REFERENCES
          // ==========================================

          Console.WriteLine();

          Console.WriteLine(
              "======================================"
          );

          Console.WriteLine(
              "REFERENCES"
          );

          Console.WriteLine(
              "======================================"
          );

          foreach (
              AssemblyName reference
              in assembly.GetReferencedAssemblies()
                  .OrderBy(r => r.Name)
          )
          {
              Console.WriteLine(
                  $"{reference.Name} | {reference.Version}"
              );
          }

          // ==========================================
          // TYPES
          // ==========================================

          Console.WriteLine();

          Console.WriteLine(
              "======================================"
          );

          Console.WriteLine(
              "TYPES"
          );

          Console.WriteLine(
              "======================================"
          );

          Type[] types;

          try
          {
              types = assembly.GetTypes();
          }
          catch (ReflectionTypeLoadException ex)
          {
              Console.WriteLine();

              Console.WriteLine(
                  "ReflectionTypeLoadException"
              );

              Console.WriteLine();

              Console.WriteLine(
                  "LOADER EXCEPTIONS:"
              );

              foreach (
                  Exception loaderException
                  in ex.LoaderExceptions
              )
              {
                  Console.WriteLine(
                      loaderException?.Message
                  );
              }

              types = ex.Types
                  .Where(t => t != null)
                  .ToArray()!;
          }

          foreach (
              Type type
              in types.OrderBy(t => t.FullName)
          )
          {
              Console.WriteLine();

              Console.WriteLine(
                  "[TYPE]"
              );

              Console.WriteLine(
                  type.FullName
              );

              // ==========================================
              // METHODS
              // ==========================================

              MethodInfo[] methods =
                  type.GetMethods(
                      BindingFlags.Public |
                      BindingFlags.NonPublic |
                      BindingFlags.Instance |
                      BindingFlags.Static |
                      BindingFlags.DeclaredOnly
                  );

              if (methods.Length > 0)
              {
                  Console.WriteLine(
                      "  [METHODS]"
                  );

                  foreach (
                      MethodInfo method
                      in methods.OrderBy(m => m.Name)
                  )
                  {
                      string parameters =
                          string.Join(
                              ", ",
                              method.GetParameters()
                                  .Select(
                                      p =>
                                          $"{p.ParameterType.Name} {p.Name}"
                                  )
                          );

                      Console.WriteLine(
                          $"    {method.ReturnType.Name} " +
                          $"{method.Name}({parameters})"
                      );
                  }
              }
          }
          '@ | Set-Content `
            "DllInspector/Program.cs"

      # ==========================================
      # BUILD
      # ==========================================

      - name: BUILD INSPECTOR
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host "======================================"
          Write-Host "BUILD INSPECTOR"
          Write-Host "======================================"

          dotnet build -c Release

      # ==========================================
      # RUN
      # ==========================================

      - name: RUN INSPECTOR
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host "======================================"
          Write-Host "RUN DLL INSPECTOR"
          Write-Host "======================================"

          dotnet run > output.txt

          Write-Host ""
          Write-Host "✓ INSPECTION SELESAI"

      # ==========================================
      # SEARCH ASTC
      # ==========================================

      - name: SEARCH ASTC
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ASTC REFERENCES"
          Write-Host "======================================"

          $result = Select-String `
            -Path output.txt `
            -Pattern "ASTC" `
            -Context 5,10

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host "❌ ASTC tidak ditemukan."
          }

      # ==========================================
      # SEARCH DECODERS
      # ==========================================

      - name: SEARCH DECODERS
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ALL DECODER TYPES"
          Write-Host "======================================"

          $result = Select-String `
            -Path output.txt `
            -Pattern "Decoder|Decoders" `
            -Context 2,15

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host "❌ Decoder tidak ditemukan."
          }

      # ==========================================
      # SEARCH TEXTUREFILE
      # ==========================================

      - name: SEARCH TEXTUREFILE
        shell: pwsh
        working-directory: DllInspector
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "TEXTUREFILE / DECODEMANAGED"
          Write-Host "======================================"

          $result = Select-String `
            -Path output.txt `
            -Pattern "TextureFile|DecodeManaged" `
            -Context 5,15

          if ($result) {
              $result | ForEach-Object {
                  Write-Host $_
              }
          }
          else {
              Write-Host "❌ TextureFile / DecodeManaged tidak ditemukan."
          }

      # ==========================================
      # UPLOAD OUTPUT
      # ==========================================

      - name: UPLOAD RESULT
        uses: actions/upload-artifact@v4
        with:
          name: Texture-DLL-Inspection
          path: DllInspector/output.txt
