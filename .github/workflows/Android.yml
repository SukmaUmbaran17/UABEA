name: UABEA Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore UABEA
        run: dotnet restore UABEAvalonia/UABEAvalonia.csproj

      - name: Build UABEA
        run: dotnet build UABEAvalonia/UABEAvalonia.csproj -c Release --no-restore

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: UABEAvalonia/bin/Release/
