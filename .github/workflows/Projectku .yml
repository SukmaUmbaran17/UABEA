name: Rakit UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    # 1. GLOBAL JSON FORCE: Mengunci arsitektur SDK agar tidak melirik profil komputer desktop
    - name: Create Global JSON
      run: |
        @'
        {
          "sdk": {
            "version": "8.0.100",
            "rollForward": "latestFeature"
          }
        }
        '@ | Out-File -FilePath "global.json" -Encoding utf8

    # 2. MEMBUAT PROYEK: Mengunci isolasi total agar compiler HANYA merakit file Properties bawaan Android kita
    - name: Create Clean Android Project
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Library</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <AvaloniaUseCompiledBindings>false</AvaloniaUseCompiledBindings>
            <CheckEolWorkloads>false</CheckEolWorkloads>
            <!-- SUNTIKAN SAKTI: Memutus hubungan massal total dari folder UABEAvalonia PC -->
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <EnableDefaultAvaloniaResourceItems>false</EnableDefaultAvaloniaResourceItems>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
            <!-- KITA KUNCI KETAT: Hanya boleh merakit file MainActivity Android murni kita sendiri -->
            <Compile Include="Properties\MainActivity.cs" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAndroidApp.csproj" -Encoding utf8

    # 3. Membuat file kode pemicu (Main) di folder Properties depan
    - name: Create Dummy MainActivity
      run: |
        New-Item -ItemType Directory -Force -Path "Properties"
        @'
        using Android.App;
        using Android.Content.PM;
        using Avalonia.Android;

        namespace UABEAndroidApp;

        [Activity(Label = "UABE Android", DocumentLaunchMode = DocumentLaunchMode.Always, MainLauncher = true, ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.ScreenSize | ConfigChanges.UiMode)]
        public class MainActivity : AvaloniaMainActivity
        {
        }
        '@ | Out-File -FilePath "Properties\MainActivity.cs" -Encoding utf8

    # 4. RESTORE AMAN: Sinkronisasi akhir beban kerja Android
    - name: Restore Dependencies Direct
      run: |
        dotnet workload restore UABEAndroidApp.csproj
        dotnet restore UABEAndroidApp.csproj --no-cache -p:CheckEolWorkloads=false

    # 5. COMPILE UTAMA: Merakit biner menjadi berkas APK mentah tanpa menyentuh satu pun file PC
    - name: Compile APK Direct
      run: |
        dotnet publish UABEAndroidApp.csproj -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # 6. UPLOAD FINAL: Menerbitkan berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android\*Signed.apk
        
