name: Rakit UABE Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 1. SAPU BERSIH: Menghapus sisa file solusi desktop di folder server agar tidak mengunci mode PC
    - name: Wipe All Desktop Interventions
      run: |
        Get-ChildItem -Path "D:\a\UABEAvalonia\" -Filter *.slnx -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
        Get-ChildItem -Path "D:\a\UABEAvalonia\" -Filter *.sln -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

    # 2. GLOBAL JSON FORCE: Memaksa server mengunci arsitektur SDK ke mode mobile Android
    - name: Create Global JSON
      run: |
        @'
        {
          "sdk": {
            "version": "8.0.100",
            "rollForward": "latestFeature"
          }
        }
        '@ | Out-File -FilePath "global.json" -Encoding utf8

    # 3. PASANG WORKLOAD BARU: Menginstal SDK Android tepat di dalam lingkungan terisolasi global.json
    - name: Install Android Workload
      run: dotnet workload install android

    # 4. Membuat file Proyek Android murni dengan deklarasi platform yang ketat
    - name: Create Clean Android Project
      run: |
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net8.0-android</TargetFramework>
            <SupportedOSPlatformVersion>31</SupportedOSPlatformVersion>
            <OutputType>Library</OutputType>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <ApplicationId>com.sukma.uabea.android</ApplicationId>
            <AvaloniaUseCompiledBindings>false</AvaloniaUseCompiledBindings>
            <CheckEolWorkloads>false</CheckEolWorkloads>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="Avalonia.Android" Version="11.0.10" />
          </ItemGroup>
        </Project>
        '@ | Out-File -FilePath "UABEAndroidApp.csproj" -Encoding utf8

    # 5. Membuat file kode pemicu (Main) di folder Properties depan
    - name: Create Dummy MainActivity
      run: |
        New-Item -ItemType Directory -Force -Path "Properties"
        @'
        using Android.App;
        using Android.Content.PM;
        using Avalonia.Android;

        namespace UABEAndroidApp;

        [Activity(Label = "UABE Android", DocumentLaunchMode = DocumentLaunchMode.Always, MainLauncher = true, ConfigurationChanges = ConfigChanges.Orientation | ConfigChanges.ScreenSize | ConfigChanges.UiMode)]
        public class MainActivity : AvaloniaMainActivity
        {
        }
        '@ | Out-File -FilePath "Properties\MainActivity.cs" -Encoding utf8

    # 6. RESTORE AMAN: Melakukan Restore dependencies langsung ke berkas proyek mandiri
    - name: Restore Dependencies Direct
      run: |
        dotnet workload restore UABEAndroidApp.csproj
        dotnet restore UABEAndroidApp.csproj --no-cache -p:CheckEolWorkloads=false

    # 7. COMPILE UTAMA: Merakit berkas menjadi aplikasi APK utuh
    - name: Compile APK Direct
      run: |
        dotnet publish UABEAndroidApp.csproj -c Release -f net8.0-android --no-restore -p:CheckEolWorkloads=false

    # 8. UPLOAD FINAL: Mengunggah hasil berkas APK final Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UABEAvalonia-Android-APK
        path: bin\Release\net8.0-android\*Signed.apk
        
