name: check_apk

on:
  workflow_dispatch:

jobs:
  build-android:
    name: check_apk
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP .NET
      # ==========================================
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      # ==========================================
      # 3. INSTALL ANDROID WORKLOAD
      # ==========================================
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android


      # ==========================================
      # 4. SHOW IMPORTANT FILES
      # ==========================================
      - name: Verify AssetsTools files
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "VERIFY ASSETSTOOLS FILES"
          Write-Host "======================================"

          $libs = Join-Path $env:GITHUB_WORKSPACE "Libs"

          Write-Host ""
          Write-Host "Libs:"
          Write-Host $libs

          if (-not (Test-Path $libs)) {
            Write-Error "Folder Libs tidak ditemukan!"
            exit 1
          }

          Write-Host ""
          Write-Host "AssetsTools files:"

          Get-ChildItem `
            -Path $libs `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "AssetsTools.NET*"
            } |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

          Write-Host ""

          $textureSource = Join-Path `
            $libs `
            "AssetsTools.NET.Texture.dll"

          if (Test-Path $textureSource) {

            Write-Host "✅ SOURCE DLL DITEMUKAN:"
            Write-Host $textureSource

            $file = Get-Item $textureSource

            Write-Host ""
            Write-Host "Size:"
            Write-Host "$($file.Length) bytes"

          }
          else {

            Write-Error `
              "AssetsTools.NET.Texture.dll TIDAK ADA DI Libs!"

            exit 1
          }


      # ==========================================
      # 5. RESTORE ANDROID PROJECT
      # ==========================================
      - name: Restore Android project
        shell: pwsh
        run: |

          dotnet restore `
            UABEAvalonia.Android/UABEAvalonia.Android.csproj


      # ==========================================
      # 6. BUILD APK
      # ==========================================
      - name: Build Android APK
        shell: pwsh
        run: |

          dotnet build `
            UABEAvalonia.Android/UABEAvalonia.Android.csproj `
            -c Release `
            --no-restore


      # ==========================================
      # 7. FIND APK
      # ==========================================
      - name: Find APK
        id: find-apk
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCHING APK"
          Write-Host "======================================"

          $apkRoot = `
            Join-Path `
            $env:GITHUB_WORKSPACE `
            "UABEAvalonia.Android/bin/Release"

          $apk = Get-ChildItem `
            -Path $apkRoot `
            -Filter "*.apk" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if ($null -eq $apk) {

            Write-Error "APK tidak ditemukan!"
            exit 1
          }

          Write-Host ""
          Write-Host "APK ditemukan:"
          Write-Host $apk.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($apk.Length) bytes"

          "APK_PATH=$($apk.FullName)" `
            >> $env:GITHUB_ENV


      # ==========================================
      # 8. EXTRACT APK
      # ==========================================
      - name: Extract APK
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "EXTRACT APK"
          Write-Host "======================================"

          $extract = `
            Join-Path `
            $env:RUNNER_TEMP `
            "apk_extract"

          if (Test-Path $extract) {

            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            | Out-Null

          Write-Host ""
          Write-Host "APK:"
          Write-Host $env:APK_PATH

          Write-Host ""
          Write-Host "Extract directory:"
          Write-Host $extract

          Expand-Archive `
            -LiteralPath $env:APK_PATH `
            -DestinationPath $extract `
            -Force

          "APK_EXTRACT=$extract" `
            >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "✅ APK extraction selesai."


      # ==========================================
      # 9. SEARCH PHYSICAL ASSEMBLIES
      # ==========================================
      - name: Search physical AssetsTools assemblies
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCH PHYSICAL ASSETSTOOLS ASSEMBLIES"
          Write-Host "======================================"

          $extract = $env:APK_EXTRACT

          $files = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "AssetsTools.NET*"
            }

          if ($files) {

            Write-Host ""
            Write-Host "AssetsTools files found:"

            foreach ($file in $files) {

              Write-Host ""
              Write-Host "Name:"
              Write-Host $file.Name

              Write-Host "Size:"
              Write-Host "$($file.Length) bytes"

              Write-Host "Path:"
              Write-Host $file.FullName
            }

          }
          else {

            Write-Host ""
            Write-Host "❌ Tidak ada AssetsTools.NET file fisik di APK."

          }


          Write-Host ""
          Write-Host "======================================"
          Write-Host "DIRECT TEXTURE DLL CHECK"
          Write-Host "======================================"

          $texture = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -File `
            -Filter "AssetsTools.NET.Texture.dll" `
            -ErrorAction SilentlyContinue

          if ($texture) {

            Write-Host ""
            Write-Host "🎉🎉🎉"
            Write-Host "✅ AssetsTools.NET.Texture.dll"
            Write-Host "   DITEMUKAN DI APK!"
            Write-Host ""

            foreach ($file in $texture) {

              Write-Host "Path:"
              Write-Host $file.FullName

              Write-Host ""
              Write-Host "Size:"
              Write-Host "$($file.Length) bytes"
            }

          }
          else {

            Write-Host ""
            Write-Host "❌ AssetsTools.NET.Texture.dll"
            Write-Host "   TIDAK DITEMUKAN SEBAGAI FILE FISIK."

          }


      # ==========================================
      # 10. SEARCH INSIDE ASSEMBLY BLOBS
      # ==========================================
      - name: Search assembly blobs
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCH INSIDE ASSEMBLY BLOBS"
          Write-Host "======================================"

          $extract = $env:APK_EXTRACT

          $blobs = Get-ChildItem `
            -Path $extract `
            -Filter "*.blob" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $blobs -or $blobs.Count -eq 0) {

            Write-Host ""
            Write-Host "❌ Tidak ada assembly blob ditemukan."

          }
          else {

            Write-Host ""
            Write-Host "Blob ditemukan:"
            Write-Host $blobs.Count


            foreach ($blob in $blobs) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "CHECKING BLOB"
              Write-Host "======================================"

              Write-Host "File:"
              Write-Host $blob.Name

              Write-Host ""
              Write-Host "Size:"
              Write-Host "$($blob.Length) bytes"

              Write-Host ""
              Write-Host "Path:"
              Write-Host $blob.FullName


              try {

                $bytes = `
                  [System.IO.File]::ReadAllBytes(
                    $blob.FullName
                  )

                $ascii = `
                  [System.Text.Encoding]::ASCII.GetString(
                    $bytes
                  )

              }
              catch {

                Write-Host ""
                Write-Host "⚠️ Gagal membaca blob."
                continue
              }


              # --------------------------------------
              # AssetsTools.NET.Texture
              # --------------------------------------

              Write-Host ""
              Write-Host "Searching:"
              Write-Host "AssetsTools.NET.Texture"

              if ($ascii.Contains(
                "AssetsTools.NET.Texture"
              )) {

                Write-Host ""
                Write-Host "✅ AssetsTools.NET.Texture"
                Write-Host "   DITEMUKAN DI BLOB!"

              }
              else {

                Write-Host ""
                Write-Host "❌ AssetsTools.NET.Texture"
                Write-Host "   TIDAK DITEMUKAN DI BLOB!"

              }


              # --------------------------------------
              # AssetsTools.NET
              # --------------------------------------

              Write-Host ""
              Write-Host "Searching:"
              Write-Host "AssetsTools.NET"

              if ($ascii.Contains(
                "AssetsTools.NET"
              )) {

                Write-Host ""
                Write-Host "✅ AssetsTools.NET"
                Write-Host "   DITEMUKAN DI BLOB!"

              }
              else {

                Write-Host ""
                Write-Host "❌ AssetsTools.NET"
                Write-Host "   TIDAK DITEMUKAN DI BLOB!"

              }


              # --------------------------------------
              # TextureFile
              # --------------------------------------

              Write-Host ""
              Write-Host "Searching:"
              Write-Host "TextureFile"

              if ($ascii.Contains(
                "TextureFile"
              )) {

                Write-Host ""
                Write-Host "✅ TextureFile"
                Write-Host "   DITEMUKAN DI BLOB!"

              }
              else {

                Write-Host ""
                Write-Host "❌ TextureFile"
                Write-Host "   TIDAK DITEMUKAN DI BLOB!"

              }

            }
          }


      # ==========================================
      # 11. SEARCH APK FOR ASSEMBLY NAMES
      # ==========================================
      - name: Search assembly names
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCH ASSEMBLY NAMES"
          Write-Host "======================================"

          $extract = $env:APK_EXTRACT

          $interesting = @(
            "AssetsTools.NET",
            "AssetsTools.NET.Texture",
            "TextureFile"
          )

          $files = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {

            if (
              $file.Name -like "*AssetsTools*" -or
              $file.Name -like "*Texture*"
            ) {

              Write-Host ""
              Write-Host "Candidate:"
              Write-Host $file.FullName

            }
          }


      # ==========================================
      # 12. FINAL APK INFORMATION
      # ==========================================
      - name: APK information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FINAL APK INFORMATION"
          Write-Host "======================================"

          $apk = Get-Item $env:APK_PATH

          Write-Host ""
          Write-Host "Name:"
          Write-Host $apk.Name

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($apk.Length) bytes"

          Write-Host ""
          Write-Host "Path:"
          Write-Host $apk.FullName


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK-Texture-Check
          path: |
            UABEAvalonia.Android/bin/Release/**/*.apk
          if-no-files-found: error


      # ==========================================
      # 14. UPLOAD INSPECTION
      # ==========================================
      - name: Upload APK extraction
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK-Inspection
          path: |
            ${{ env.APK_EXTRACT }}
          if-no-files-found: warn
