name: Check APK Texture

on:
  push:
    branches:
      - android-port

  workflow_dispatch:

jobs:
  check-apk:
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP .NET
      # ==========================================
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      # ==========================================
      # 3. INSTALL ANDROID WORKLOAD
      # ==========================================
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android


      # ==========================================
      # 4. RESTORE ANDROID PROJECT
      # ==========================================
      - name: Restore Android project
        shell: pwsh
        run: |
          dotnet restore `
            UABEAvalonia.Android/UABEAvalonia.Android.csproj


      # ==========================================
      # 5. BUILD APK
      # ==========================================
      - name: Build Android APK
        shell: pwsh
        run: |
          dotnet build `
            UABEAvalonia.Android/UABEAvalonia.Android.csproj `
            -c Release `
            --no-restore


      # ==========================================
      # 6. FIND APK
      # ==========================================
      - name: Find APK
        id: find-apk
        shell: pwsh
        run: |

          Write-Host "======================================"
          Write-Host "SEARCHING APK"
          Write-Host "======================================"

          $apk = Get-ChildItem `
            -Path "UABEAvalonia.Android/bin/Release" `
            -Filter "*.apk" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $apk) {

            Write-Error "APK tidak ditemukan!"
            exit 1

          }

          Write-Host ""
          Write-Host "APK ditemukan:"
          Write-Host $apk.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($apk.Length) bytes"

          "APK_PATH=$($apk.FullName)" `
            >> $env:GITHUB_ENV


      # ==========================================
      # 7. INSPECT APK CONTENTS
      # ==========================================
      - name: Inspect APK contents
        shell: pwsh
        run: |

          Write-Host "======================================"
          Write-Host "APK CONTENT INSPECTION"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Using APK:"
          Write-Host $env:APK_PATH

          # --------------------------------------
          # Prepare extraction directory
          # --------------------------------------

          $extract = "$env:RUNNER_TEMP\apk_extract"

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extract `
            | Out-Null

          Write-Host ""
          Write-Host "Extracting APK..."

          # --------------------------------------
          # APK sebenarnya adalah ZIP
          # --------------------------------------

          Expand-Archive `
            -LiteralPath $env:APK_PATH `
            -DestinationPath $extract `
            -Force

          Write-Host ""
          Write-Host "APK extraction selesai."


          # ======================================
          # SEARCH TEXTURE DLL
          # ======================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCH AssetsTools.NET.Texture.dll"
          Write-Host "======================================"

          $textureDll = Get-ChildItem `
            -Path $extract `
            -Filter "AssetsTools.NET.Texture.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($textureDll) {

            Write-Host ""
            Write-Host "✅ AssetsTools.NET.Texture.dll"
            Write-Host "   DITEMUKAN DI APK!"

            foreach ($file in $textureDll) {

              Write-Host ""
              Write-Host "Path:"
              Write-Host $file.FullName

              Write-Host "Size:"
              Write-Host "$($file.Length) bytes"
            }

          }
          else {

            Write-Host ""
            Write-Host "❌ AssetsTools.NET.Texture.dll"
            Write-Host "   TIDAK DITEMUKAN DI APK!"

          }


          # ======================================
          # SEARCH ALL ASSETSTOOLS DLL
          # ======================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ALL AssetsTools DLL"
          Write-Host "======================================"

          $assetDlls = Get-ChildItem `
            -Path $extract `
            -Filter "*AssetsTools*.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($assetDlls) {

            foreach ($dll in $assetDlls) {

              Write-Host ""
              Write-Host "DLL:"
              Write-Host $dll.Name

              Write-Host "Size:"
              Write-Host "$($dll.Length) bytes"

              Write-Host "Path:"
              Write-Host $dll.FullName
            }

          }
          else {

            Write-Host ""
            Write-Host "Tidak ada AssetsTools DLL ditemukan."

          }


          # ======================================
          # POSSIBLE .NET ASSEMBLY LOCATIONS
          # ======================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "POSSIBLE .NET ASSEMBLY LOCATIONS"
          Write-Host "======================================"

          $assemblyFiles = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -Include "*.blob","*.so","*.dat" `
            -ErrorAction SilentlyContinue

          if ($assemblyFiles) {

            foreach ($file in $assemblyFiles) {

              Write-Host ""
              Write-Host $file.Name
              Write-Host "Size: $($file.Length)"
              Write-Host "Path: $($file.FullName)"
            }

          }
          else {

            Write-Host "Tidak ditemukan file assembly blob."

          }


      # ==========================================
      # 8. SEARCH INSIDE ASSEMBLY BLOBS
      # ==========================================
      - name: Search Texture DLL inside assembly blobs
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SEARCH INSIDE ASSEMBLY BLOBS"
          Write-Host "======================================"

          $extract = "$env:RUNNER_TEMP\apk_extract"

          $blobs = Get-ChildItem `
            -Path $extract `
            -Filter "*.blob" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($null -eq $blobs -or $blobs.Count -eq 0) {

            Write-Host ""
            Write-Host "❌ Tidak ada assembly blob ditemukan."

            exit 0
          }


          foreach ($blob in $blobs) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host "CHECKING BLOB"
            Write-Host "======================================"

            Write-Host "File:"
            Write-Host $blob.Name

            Write-Host ""
            Write-Host "Size:"
            Write-Host "$($blob.Length) bytes"

            Write-Host ""
            Write-Host "Path:"
            Write-Host $blob.FullName


            # --------------------------------------
            # Read binary as bytes
            # --------------------------------------

            try {

              $bytes = `
                [System.IO.File]::ReadAllBytes(
                  $blob.FullName
                )

            }
            catch {

              Write-Host ""
              Write-Host "⚠️ Tidak dapat membaca blob."

              continue
            }


            # --------------------------------------
            # Search ASCII strings
            # --------------------------------------

            $asciiText = `
              [System.Text.Encoding]::ASCII.GetString(
                $bytes
              )


            # ======================================
            # SEARCH TEXTURE ASSEMBLY
            # ======================================

            Write-Host ""
            Write-Host "Searching:"
            Write-Host "AssetsTools.NET.Texture"

            if (
              $asciiText.Contains(
                "AssetsTools.NET.Texture"
              )
            ) {

              Write-Host ""
              Write-Host "✅ AssetsTools.NET.Texture"
              Write-Host "   DITEMUKAN DI BLOB!"

            }
            else {

              Write-Host ""
              Write-Host "❌ AssetsTools.NET.Texture"
              Write-Host "   TIDAK DITEMUKAN DI BLOB!"

            }


            # ======================================
            # SEARCH BASE ASSETSTOOLS
            # ======================================

            Write-Host ""
            Write-Host "Searching:"
            Write-Host "AssetsTools.NET"

            if (
              $asciiText.Contains(
                "AssetsTools.NET"
              )
            ) {

              Write-Host ""
              Write-Host "✅ AssetsTools.NET"
              Write-Host "   DITEMUKAN DI BLOB!"

            }
            else {

              Write-Host ""
              Write-Host "❌ AssetsTools.NET"
              Write-Host "   TIDAK DITEMUKAN DI BLOB!"

            }


            # ======================================
            # SEARCH TEXTURE NAMESPACE
            # ======================================

            Write-Host ""
            Write-Host "Searching:"
            Write-Host "TextureFile"

            if (
              $asciiText.Contains(
                "TextureFile"
              )
            ) {

              Write-Host ""
              Write-Host "✅ TextureFile"
              Write-Host "   DITEMUKAN DI BLOB!"

            }
            else {

              Write-Host ""
              Write-Host "❌ TextureFile"
              Write-Host "   TIDAK DITEMUKAN DI BLOB!"

            }

          }


      # ==========================================
      # 9. CHECK APK FILE SIZE
      # ==========================================
      - name: APK information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FINAL APK INFORMATION"
          Write-Host "======================================"

          $apk = Get-Item $env:APK_PATH

          Write-Host ""
          Write-Host "Name:"
          Write-Host $apk.Name

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($apk.Length) bytes"

          Write-Host ""
          Write-Host "Path:"
          Write-Host $apk.FullName


      # ==========================================
      # 10. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-APK-Texture-Check
          path: |
            UABEAvalonia.Android/bin/Release/**/*.apk
          if-no-files-found: error
