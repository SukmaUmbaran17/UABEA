name: Build TexToolWrap Android

on:
  workflow_dispatch:
  push:
    paths:
      - "TexToolWrap/**"
      - ".github/workflows/build-textoolwrap-android.yml"

jobs:
  inspect-and-build:
    name: Inspect TexToolWrap for Android
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 2. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 3. INSTALL NDK
      # ============================================================

      - name: Install Android NDK
        shell: bash
        run: |
          echo "======================================="
          echo "ANDROID NDK"
          echo "======================================="

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.3.11579264"

          NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME" >> "$GITHUB_PATH"

          "$NDK_HOME/ndk-build" --version


      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================

      - name: Verify project
        shell: bash
        run: |
          echo "======================================="
          echo "TEXTOOLWRAP PROJECT"
          echo "======================================="

          test -f TexToolWrap/textoolwrap.cpp
          test -f TexToolWrap/Android/CMakeLists.txt

          test -d TexToolWrap/PVRTexLib
          test -d TexToolWrap/ispc
          test -d TexToolWrap/crunch

          echo "✓ textoolwrap.cpp"
          echo "✓ Android/CMakeLists.txt"
          echo "✓ PVRTexLib"
          echo "✓ ISPC"
          echo "✓ Crunch"


      # ============================================================
      # 5. COMPLETE PVRTEXLIB INSPECTION
      # ============================================================

      - name: Inspect PVRTexLib
        shell: bash
        run: |
          echo "======================================="
          echo "PVRTEXLIB INSPECTION"
          echo "======================================="

          echo ""
          echo "DIRECTORIES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type d \
            -print | sort


          echo ""
          echo "FILES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type f \
            -print | sort


          echo ""
          echo "SOURCE FILES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type f \
            \( \
              -name "*.cpp" \
              -o -name "*.cc" \
              -o -name "*.cxx" \
              -o -name "*.c" \
            \) \
            -print | sort


          echo ""
          echo "HEADER FILES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type f \
            \( \
              -name "*.h" \
              -o -name "*.hpp" \
            \) \
            -print | sort


          echo ""
          echo "LIBRARY FILES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
              -o -name "*.lib" \
              -o -name "*.dll" \
            \) \
            -print | sort


          echo ""
          echo "CMAKE FILES"
          echo "---------------------------------------"

          find TexToolWrap/PVRTexLib \
            -type f \
            -iname "CMakeLists.txt" \
            -print | sort


      # ============================================================
      # 6. CHECK LIBRARY ARCHITECTURES
      # ============================================================

      - name: Check PVRTexLib architectures
        shell: bash
        run: |
          echo "======================================="
          echo "CHECK LIBRARY ARCHITECTURES"
          echo "======================================="

          LIBRARIES=$(find TexToolWrap/PVRTexLib \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
              -o -name "*.lib" \
              -o -name "*.dll" \
            \))

          if [ -z "$LIBRARIES" ]; then
            echo "Tidak ada prebuilt library."
            exit 0
          fi

          while IFS= read -r LIB; do

            echo ""
            echo "---------------------------------------"
            echo "$LIB"
            echo "---------------------------------------"

            file "$LIB" || true

          done <<< "$LIBRARIES"


      # ============================================================
      # 7. SEARCH FOR ANDROID LIBRARIES
      # ============================================================

      - name: Search Android PVRTexLib
        shell: bash
        run: |
          echo "======================================="
          echo "SEARCH ANDROID PVRTEXLIB"
          echo "======================================="

          FOUND=0

          while IFS= read -r FILE; do

            case "$FILE" in

              *Android*)
                echo "✓ ANDROID CANDIDATE:"
                echo "$FILE"
                FOUND=1
                ;;

            esac

          done < <(
            find TexToolWrap/PVRTexLib \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.a" \
              \) \
              -print
          )

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ Tidak ditemukan library Android PVRTexLib."
          else
            echo "✓ Kandidat Android ditemukan."
          fi


      # ============================================================
      # 8. SEARCH SOURCE EVERYWHERE
      # ============================================================

      - name: Search PVRTexLib source
        shell: bash
        run: |
          echo "======================================="
          echo "SEARCH PVRTEXLIB SOURCE"
          echo "======================================="

          find . \
            -type f \
            \( \
              -iname "*pvrt*.cpp" \
              -o -iname "*pvrt*.c" \
              -o -iname "*pvrt*.h" \
              -o -iname "*texture*.cpp" \
              -o -iname "*texture*.h" \
            \) \
            -print | sort


      # ============================================================
      # 9. SEARCH BUILD SYSTEM
      # ============================================================

      - name: Search native build systems
        shell: bash
        run: |
          echo "======================================="
          echo "BUILD SYSTEMS"
          echo "======================================="

          find TexToolWrap \
            -type f \
            \( \
              -iname "CMakeLists.txt" \
              -o -iname "Makefile" \
              -o -iname "*.vcxproj" \
              -o -iname "*.sln" \
            \) \
            -print | sort


      # ============================================================
      # 10. SEARCH TEXTOOLWRAP DEPENDENCIES
      # ============================================================

      - name: Inspect TexToolWrap includes
        shell: bash
        run: |
          echo "======================================="
          echo "TEXTOOLWRAP INCLUDES"
          echo "======================================="

          grep -nE \
            '#include|PVRTex|Crunch|ISPC' \
            TexToolWrap/textoolwrap.cpp \
            || true


      # ============================================================
      # 11. SUMMARY
      # ============================================================

      - name: Generate summary
        shell: bash
        run: |
          echo ""
          echo "======================================="
          echo "TEXTOOLWRAP ANALYSIS COMPLETE"
          echo "======================================="

          echo ""
          echo "Target ABI:"
          echo "arm64-v8a"

          echo ""
          echo "Android platform:"
          echo "android-24"

          echo ""
          echo "Current PVRTexLib libraries:"
          find TexToolWrap/PVRTexLib \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.a" \
              -o -name "*.lib" \
            \) \
            -print | sort

          echo ""
          echo "======================================="
