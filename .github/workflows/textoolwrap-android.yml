name: Build TextToolWrap Android

on:
  workflow_dispatch:

jobs:
  build-textoolwrap:
    name: Build TextToolWrap Android ARM64
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. ANDROID NDK
      # ==========================================
      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;27.2.12479018"

      # ==========================================
      # 5. VERIFY PROJECT STRUCTURE
      # ==========================================
      - name: Verify TexToolWrap
        run: |
          echo "======================================="
          echo "TEXTOOLWRAP STRUCTURE"
          echo "======================================="

          pwd

          echo ""
          echo "Files:"
          find TexToolWrap -maxdepth 3 -type f | sort

          echo ""
          echo "======================================="
          echo "CMAKE FILES"
          echo "======================================="

          find . -iname "CMakeLists.txt" -print

      # ==========================================
      # 6. VERIFY REQUIRED FILES
      # ==========================================
      - name: Verify Required Files
        run: |
          echo "======================================="
          echo "VERIFY REQUIRED FILES"
          echo "======================================="

          test -f TexToolWrap/textoolwrap.cpp
          test -f TexToolWrap/android/CMakeLists.txt

          test -d TexToolWrap/PVRTexLib
          test -d TexToolWrap/ispc
          test -d TexToolWrap/crunch

          echo ""
          echo "✓ textoolwrap.cpp ditemukan"
          echo "✓ CMakeLists.txt ditemukan"
          echo "✓ PVRTexLib ditemukan"
          echo "✓ ISPC ditemukan"
          echo "✓ Crunch ditemukan"

      # ==========================================
      # 7. CHECK CMAKE
      # ==========================================
      - name: Check CMake
        run: |
          cmake --version

      # ==========================================
      # 8. CHECK NDK
      # ==========================================
      - name: Check NDK
        run: |
          echo "======================================="
          echo "ANDROID NDK"
          echo "======================================="

          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      # ==========================================
      # 9. PREPARE BUILD
      # ==========================================
      - name: Prepare Build Directory
        run: |
          rm -rf TexToolWrap/android/build

          mkdir -p TexToolWrap/android/build

          echo "Build directory:"
          ls -la TexToolWrap/android

      # ==========================================
      # 10. CONFIGURE CMAKE
      # ==========================================
      - name: Configure CMake
        run: |
          cmake \
            -S TexToolWrap/android \
            -B TexToolWrap/android/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

            # ==========================================
      # 11. BUILD
      # ==========================================
      - name: Build TextToolWrap
        run: |
          cmake \
            --build TexToolWrap/android/build \
            --config Release \
            --parallel 2

      # ==========================================
      # 12. SEARCH RESULT
      # ==========================================
      - name: Search Native Libraries
        run: |
          echo "======================================="
          echo "NATIVE LIBRARIES"
          echo "======================================="

          find TexToolWrap/android/build \
            -type f \
            -name "*.so" \
            -print

      # ==========================================
      # 13. COLLECT RESULT
      # ==========================================
      - name: Collect libtextoolwrap.so
        run: |
          mkdir -p TexToolWrap/Android/arm64-v8a

          find TexToolWrap/android/build \
            -type f \
            -name "libtextoolwrap.so" \
            -exec cp {} TexToolWrap/Android/arm64-v8a/ \;

          echo "======================================="
          echo "FINAL TEXTTOOLWRAP"
          echo "======================================="

          ls -lh TexToolWrap/Android/arm64-v8a/

      # ==========================================
      # 14. UPLOAD ARTIFACT
      # ==========================================
      - name: Upload TextToolWrap
        uses: actions/upload-artifact@v4
        with:
          name: TextToolWrap-Android-arm64-v8a
          path: TexToolWrap/Android/arm64-v8a/libtextoolwrap.so
