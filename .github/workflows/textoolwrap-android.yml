name: Build TexToolWrap Android

on:
  workflow_dispatch:
  push:
    paths:
      - "TexToolWrap/**"
      - ".github/workflows/build-textoolwrap-android.yml"

jobs:
  build-textoolwrap:
    name: Build TexToolWrap Android ARM64
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.3.11579264"


      - name: Configure NDK
        shell: bash
        run: |
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"

          if [ ! -d "$NDK_HOME" ]; then
            echo "ERROR: NDK tidak ditemukan"
            exit 1
          fi

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME" >> "$GITHUB_PATH"

          echo "NDK:"
          "$NDK_HOME/ndk-build" --version


      - name: Verify TexToolWrap
        shell: bash
        run: |
          echo "======================================="
          echo "VERIFY TEXTOOLWRAP"
          echo "======================================="

          FAILED=0

          check_file() {
            if [ -f "$1" ]; then
              echo "✓ FILE : $1"
            else
              echo "✗ FILE MISSING : $1"
              FAILED=1
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "✓ DIR  : $1"
            else
              echo "✗ DIR MISSING : $1"
              FAILED=1
            fi
          }

          check_file "TexToolWrap/textoolwrap.cpp"
          check_file "TexToolWrap/Android/CMakeLists.txt"

          check_dir "TexToolWrap/PVRTexLib"
          check_dir "TexToolWrap/ispc"
          check_dir "TexToolWrap/crunch"

          echo ""
          echo "======================================="
          echo "SOURCE TREE"
          echo "======================================="

          find TexToolWrap \
            -maxdepth 4 \
            -type f \
            -print | sort

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi


      - name: Inspect PVRTexLib
        shell: bash
        run: |
          echo "======================================="
          echo "PVRTEXLIB"
          echo "======================================="

          echo ""
          echo "Directories:"
          find TexToolWrap/PVRTexLib \
            -maxdepth 3 \
            -type d \
            -print | sort

          echo ""
          echo "C/C++ sources:"
          find TexToolWrap/PVRTexLib \
            -type f \
            \( -name "*.cpp" -o -name "*.c" \) \
            -print | sort


      - name: Clean build
        shell: bash
        run: |
          rm -rf TexToolWrap/Android/build
          mkdir -p TexToolWrap/Android/build


      - name: Configure CMake ARM64
        shell: bash
        run: |
          echo "======================================="
          echo "CMAKE CONFIGURE"
          echo "======================================="

          cd TexToolWrap/Android/build

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

          echo ""
          echo "CMAKE CONFIGURE SUCCESS"


      - name: Build TexToolWrap
        shell: bash
        run: |
          echo "======================================="
          echo "BUILD TEXTOOLWRAP"
          echo "======================================="

          cd TexToolWrap/Android/build

          cmake --build . \
            --config Release \
            --parallel 2 \
            --verbose


      - name: Find libraries
        shell: bash
        run: |
          echo "======================================="
          echo "GENERATED LIBRARIES"
          echo "======================================="

          find TexToolWrap/Android/build \
            -type f \
            -name "*.so" \
            -print | sort || true

          echo ""
          echo "Static libraries:"
          find TexToolWrap/Android/build \
            -type f \
            -name "*.a" \
            -print | sort || true


      - name: Verify TexToolWrap library
        shell: bash
        run: |
          echo "======================================="
          echo "VERIFY TEXTOOLWRAP"
          echo "======================================="

          LIB="TexToolWrap/Android/build/libtextoolwrap.so"

          if [ ! -f "$LIB" ]; then
            echo "ERROR:"
            echo "libtextoolwrap.so tidak ditemukan."

            echo ""
            echo "Searching:"
            find TexToolWrap/Android/build \
              -type f \
              -name "*.so" \
              -print

            exit 1
          fi

          echo ""
          echo "✓ libtextoolwrap.so berhasil dibuat"
          ls -lh "$LIB"


      - name: Prepare Android JNI
        shell: bash
        run: |
          echo "======================================="
          echo "PREPARE JNI LIBRARY"
          echo "======================================="

          rm -rf output

          mkdir -p output/arm64-v8a

          cp \
            TexToolWrap/Android/build/libtextoolwrap.so \
            output/arm64-v8a/

          echo ""
          find output -type f -print


      - name: Check ELF
        shell: bash
        run: |
          echo "======================================="
          echo "CHECK ELF"
          echo "======================================="

          file output/arm64-v8a/libtextoolwrap.so

          echo ""
          echo "Library size:"
          ls -lh output/arm64-v8a/libtextoolwrap.so


      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: TexToolWrap-Android-arm64-v8a
          path: output/
          if-no-files-found: error


      - name: Final summary
        shell: bash
        run: |
          echo ""
          echo "======================================="
          echo "SUCCESS"
          echo "======================================="
          echo ""
          echo "TexToolWrap Android:"
          echo "✓ ARM64"
          echo "✓ PVRTexLib compiled"
          echo "✓ libtextoolwrap.so generated"
          echo ""
          echo "Output:"
          echo "output/arm64-v8a/libtextoolwrap.so"
          echo ""
          echo "Artifact:"
          echo "TexToolWrap-Android-arm64-v8a"
          echo ""
          echo "======================================="
