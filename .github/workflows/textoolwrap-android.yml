name: Build TexToolWrap Android

on:
  workflow_dispatch:
  push:
    paths:
      - "TexToolWrap/**"
      - ".github/workflows/build-textoolwrap-android.yml"

jobs:
  build-textoolwrap:
    name: Build TexToolWrap Android ARM64
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0


      # ============================================================
      # 2. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 3. INSTALL ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          echo "======================================="
          echo "INSTALL ANDROID NDK"
          echo "======================================="

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;26.3.11579264"

          echo ""
          echo "Installed packages:"
          sdkmanager --list_installed | grep -E "ndk|android-34|34.0.0" || true


      # ============================================================
      # 4. CONFIGURE NDK
      # ============================================================
      - name: Configure Android NDK
        shell: bash
        run: |
          echo "======================================="
          echo "CONFIGURE ANDROID NDK"
          echo "======================================="

          NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"

          if [ ! -d "$NDK_HOME" ]; then
            echo "ERROR: NDK tidak ditemukan:"
            echo "$NDK_HOME"
            exit 1
          fi

          echo "NDK_HOME=$NDK_HOME"

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME" >> "$GITHUB_PATH"

          echo ""
          "$NDK_HOME/ndk-build" --version


      # ============================================================
      # 5. VERIFY TEXTOOLWRAP
      # ============================================================
      - name: Verify TexToolWrap
        shell: bash
        run: |
          echo "======================================="
          echo "VERIFY TEXTOOLWRAP"
          echo "======================================="

          FAILED=0

          check_file() {
            if [ -f "$1" ]; then
              echo "✓ FILE : $1"
            else
              echo "✗ FILE MISSING : $1"
              FAILED=1
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "✓ DIR  : $1"
            else
              echo "✗ DIR MISSING : $1"
              FAILED=1
            fi
          }

          echo ""
          echo "SOURCE"
          check_file "TexToolWrap/textoolwrap.cpp"

          echo ""
          echo "ANDROID CMAKE"
          check_file "TexToolWrap/Android/CMakeLists.txt"

          echo ""
          echo "DEPENDENCIES"
          check_dir "TexToolWrap/PVRTexLib"
          check_dir "TexToolWrap/ispc"
          check_dir "TexToolWrap/crunch"

          echo ""
          echo "======================================="
          echo "ACTUAL TEXTOOLWRAP TREE"
          echo "======================================="

          find TexToolWrap -maxdepth 4 -print | sort

          echo ""
          echo "======================================="
          echo "SEARCH CMAKE FILES"
          echo "======================================="

          find TexToolWrap \
            -type f \
            -iname "CMakeLists.txt" \
            -print | sort

          echo ""

          if [ "$FAILED" -ne 0 ]; then
            echo "======================================="
            echo "VERIFY FAILED"
            echo "======================================="
            exit 1
          fi

          echo "======================================="
          echo "ALL REQUIRED FILES FOUND"
          echo "======================================="


      # ============================================================
      # 6. SHOW CMAKE
      # ============================================================
      - name: Inspect CMakeLists
        shell: bash
        run: |
          echo "======================================="
          echo "ANDROID CMAKE"
          echo "======================================="

          echo ""
          cat TexToolWrap/Android/CMakeLists.txt


      # ============================================================
      # 7. CREATE BUILD DIRECTORY
      # ============================================================
      - name: Create build directory
        shell: bash
        run: |
          echo "======================================="
          echo "CREATE BUILD DIRECTORY"
          echo "======================================="

          rm -rf TexToolWrap/Android/build

          mkdir -p TexToolWrap/Android/build

          ls -la TexToolWrap/Android


      # ============================================================
      # 8. CMAKE CONFIGURE ARM64
      # ============================================================
      - name: Configure CMake ARM64
        shell: bash
        run: |
          echo "======================================="
          echo "CMAKE CONFIGURE ARM64"
          echo "======================================="

          cd TexToolWrap/Android/build

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24

          echo ""
          echo "======================================="
          echo "CMAKE CONFIGURE SUCCESS"
          echo "======================================="


      # ============================================================
      # 9. BUILD
      # ============================================================
      - name: Build TexToolWrap
        shell: bash
        run: |
          echo "======================================="
          echo "BUILD TEXTOOLWRAP"
          echo "======================================="

          cd TexToolWrap/Android/build

          cmake --build . \
            --config Release \
            --parallel 2

          echo ""
          echo "======================================="
          echo "BUILD FINISHED"
          echo "======================================="


      # ============================================================
      # 10. FIND SO
      # ============================================================
      - name: Find native libraries
        shell: bash
        run: |
          echo "======================================="
          echo "SEARCH GENERATED .SO"
          echo "======================================="

          echo ""
          find TexToolWrap/Android/build \
            -type f \
            -name "*.so" \
            -print | sort || true

          echo ""
          echo "All generated files:"
          find TexToolWrap/Android/build \
            -maxdepth 6 \
            -type f \
            -print | sort || true


      # ============================================================
      # 11. VERIFY SO
      # ============================================================
      - name: Verify native library
        shell: bash
        run: |
          echo "======================================="
          echo "VERIFY NATIVE LIBRARY"
          echo "======================================="

          SO_FILES=$(find TexToolWrap/Android/build \
            -type f \
            -name "*.so" \
            -print)

          if [ -z "$SO_FILES" ]; then
            echo ""
            echo "ERROR:"
            echo "Tidak ada file .so yang dihasilkan."
            echo ""
            echo "CMake berhasil dijalankan tetapi target"
            echo "shared library belum menghasilkan .so."
            exit 1
          fi

          echo ""
          echo "✓ Native library ditemukan:"
          echo "$SO_FILES"


      # ============================================================
      # 12. PREPARE OUTPUT
      # ============================================================
      - name: Prepare Android output
        shell: bash
        run: |
          echo "======================================="
          echo "PREPARE OUTPUT"
          echo "======================================="

          rm -rf output

          mkdir -p output/arm64-v8a

          find TexToolWrap/Android/build \
            -type f \
            -name "*.so" \
            -exec cp {} output/arm64-v8a/ \;

          echo ""
          echo "Output:"
          find output -type f -print


      # ============================================================
      # 13. CHECK ELF ARCHITECTURE
      # ============================================================
      - name: Check native library architecture
        shell: bash
        run: |
          echo "======================================="
          echo "CHECK ELF ARCHITECTURE"
          echo "======================================="

          if command -v file >/dev/null 2>&1; then
            find output \
              -type f \
              -name "*.so" \
              -exec file {} \;
          fi


      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload TexToolWrap Android
        uses: actions/upload-artifact@v4
        with:
          name: TexToolWrap-Android-arm64-v8a
          path: output/
          if-no-files-found: error


      # ============================================================
      # 15. FINAL
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo ""
          echo "======================================="
          echo "TEXTOOLWRAP ANDROID BUILD COMPLETE"
          echo "======================================="

          echo ""
          echo "ABI:"
          echo "arm64-v8a"

          echo ""
          echo "Generated libraries:"
          find output \
            -type f \
            -name "*.so" \
            -print | sort

          echo ""
          echo "Artifact:"
          echo "TexToolWrap-Android-arm64-v8a"

          echo ""
          echo "======================================="
